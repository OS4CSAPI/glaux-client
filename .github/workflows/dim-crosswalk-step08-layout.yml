name: DIM V2 crosswalk — verify owner-requested Step08 layout
on:
  push:
    branches:
      - research/dim-profile-v2
    paths:
      - "Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/Master_Donor_Concept_to_DIM_Crosswalk_v0.2_06NOV2026.*"
      - "scripts/check_dim_crosswalk_step08_layout.py"
      - ".github/workflows/dim-crosswalk-step08-layout.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only checkout of research files
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check actual committed XLSX geometry and all evidence/mirrors
        run: python scripts/check_dim_crosswalk_step08_layout.py
