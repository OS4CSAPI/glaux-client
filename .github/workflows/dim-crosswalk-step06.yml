name: Verify current source-backed DIM donor crosswalk master
on:
  push:
    branches:
      - research/dim-profile-v2
    paths:
      - "Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/Master_Donor_Concept_to_DIM_Crosswalk.*"
      - "Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/SOSA_G4_F_192_Heading_Source_and_Master_Ledger_11NOV2026.json"
      - "Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/Donor_Native_High_Level_Information_Groupings_Comparison.md"
      - "scripts/check_dim_crosswalk_step06.py"
      - "scripts/publish_sosa_d.py"
      - "scripts/integrate_sosa_opportunity_checkpoint.py"
      - "Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/AAS01_Original_Source_Corpus_Coverage_13NOV2026.json"
      - "Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/SAP01_Original_Corpus_Coverage_12NOV2026.json"
      - ".github/workflows/dim-crosswalk-step06.yml"
      - "AGENTS.md"
      - "Docs/Research/DIM_Profile_V2/AGENTS.md"
      - "Docs/Research/DIM_Profile_V2/README.md"
      - "Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/README.md"
      - "Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/PITON_Donor_Concept_to_DIM_Crosswalk_v0.1_05NOV2026.md"
      - "Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/PLAN_AAS_v3_2_Source_First_Donor_Review_13NOV2026.md"
      - "Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/PLAN_Donor_Concept_to_DIM_Master_Crosswalk_v0.1_05NOV2026.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-master:
    runs-on: ubuntu-latest
    steps:
      - name: Check out committed research artifacts
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify recovery and affected master evidence
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_CHECKPOINT="$(python -c 'import json;from pathlib import Path;p=Path("Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/Master_Donor_Concept_to_DIM_Crosswalk.json");print(json.loads(p.read_text())["currentEvidenceCheckpoint"])')"
          if [[ "$CURRENT_CHECKPOINT" == "SAPIENT_SAP11_SAVED_VERIFIED" || "$CURRENT_CHECKPOINT" == "SOSA_SO2F1_SAVED_VERIFIED" || "$CURRENT_CHECKPOINT" == "SOSA_SO2F2_SAVED_VERIFIED" || "$CURRENT_CHECKPOINT" == "SOSA_SO2F3_SAVED_VERIFIED" || "$CURRENT_CHECKPOINT" == "SOSA_SO2FR_SAVED_VERIFIED" || "$CURRENT_CHECKPOINT" == "SOSA_SO2GJ_SAVED_VERIFIED" ]]; then
            python -B scripts/check_dim_crosswalk_step06.py --recovery-only
            python -B scripts/integrate_sosa_opportunity_checkpoint.py --verify
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || [[ -z "$BEFORE_SHA" ]] || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            python -B scripts/check_dim_crosswalk_step06.py
          elif git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" | grep -E '^(scripts/(check_dim_crosswalk_step06|publish_sosa_d)\.py|Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/(Master_Donor_Concept_to_DIM_Crosswalk\.|AAS01_Original_Source_Corpus_Coverage_13NOV2026\.json|SOSA_G4_F_192_Heading_Source_and_Master_Ledger_11NOV2026\.json|Donor_Native_High_Level_Information_Groupings_Comparison\.md)|\.github/workflows/dim-crosswalk-step06\.yml)' > /dev/null; then
            python -B scripts/check_dim_crosswalk_step06.py
          else
            python -B scripts/check_dim_crosswalk_step06.py --recovery-only
          fi
