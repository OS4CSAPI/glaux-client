name: Glaux Client - verified Pages deployment

on:
  workflow_dispatch:
  push:
    branches:
      - work/details-view-20261023
    paths:
      - 'Docs/Plans/GLAUX_DEPLOY_TRIGGER.md'

permissions:
  contents: read

concurrency:
  group: glaux-pages-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    env:
      CF_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out exact application revision with pinned library
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .dependencies/ogc-client/package-lock.json

      # The global artifact-register verifier currently fails on older missing
      # document links unrelated to this wireframe. Keep deployment scoped to
      # executable source checks; do not silently alter historical research docs.
      - name: Verify secret against Cloudflare Pages API (no token output)
        if: ${{ env.CF_DEPLOY_TOKEN != '' }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          token = os.environ["CF_DEPLOY_TOKEN"].strip()
          account = "952c8d3018b89940a14f6e9ffe89cef5"
          urls = [
              ("Account token verification", f"https://api.cloudflare.com/client/v4/accounts/{account}/tokens/verify"),
              ("Existing Pages project access", f"https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/glaux-client"),
          ]
          for label, url in urls:
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token, "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      status = response.status
                      data = json.loads(response.read())
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  try:
                      data = json.loads(exc.read())
                  except (ValueError, OSError):
                      data = {}
              except Exception as exc:
                  print(f"::error::{label}: network/connection error ({type(exc).__name__})")
                  sys.exit(1)
              errors = data.get("errors", [])
              codes = ",".join(str(e.get("code", "?")) for e in errors) if isinstance(errors, list) else "?"
              valid = status == 200 and data.get("success") is True
              print(f"{label}: HTTP {status}; success={valid}; error_codes={codes or 'none'}")
              if not valid:
                  print("::error::GitHub's stored Cloudflare token cannot access the requested API endpoint. Confirm the exact token value in the repository Actions secret.")
                  sys.exit(1)
          PY

      - name: Install pinned dependencies
        run: npm ci

      - name: Type-check application
        run: npm run typecheck

      - name: Run offline tests
        run: npm test

      - name: Build production assets
        run: npm run build

      - name: Report deployment credential status
        if: ${{ env.CF_DEPLOY_TOKEN == '' }}
        run: |
          echo "::warning::Cloudflare Pages deployment skipped because the CLOUDFLARE_API_TOKEN repository Actions secret is not configured."
          echo "Build and offline tests completed, but the production site was not changed."

      - name: Deploy verified build to existing Cloudflare Pages project
        if: ${{ env.CF_DEPLOY_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.154.0'
          accountId: 952c8d3018b89940a14f6e9ffe89cef5
          command: pages deploy dist --project-name=glaux-client --branch=work/details-view-20261023
