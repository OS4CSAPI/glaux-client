name: Glaux Client - verified Pages deployment

on:
  workflow_dispatch:
  push:
    branches:
      - work/details-view-20261023
    paths:
      - 'Docs/Plans/GLAUX_DEPLOY_TRIGGER.md'

permissions:
  contents: read

concurrency:
  group: glaux-pages-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    env:
      CF_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out exact application revision with pinned library
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .dependencies/ogc-client/package-lock.json

      # The global artifact-register verifier currently fails on older missing
      # document links unrelated to this wireframe. Keep deployment scoped to
      # executable source checks; do not silently alter historical research docs.
      - name: Install pinned dependencies
        run: npm ci

      - name: Type-check application
        run: npm run typecheck

      - name: Run offline tests
        run: npm test

      - name: Build production assets
        run: npm run build

      - name: Report deployment credential status
        if: ${{ env.CF_DEPLOY_TOKEN == '' }}
        run: |
          echo "::warning::Cloudflare Pages deployment skipped because the CLOUDFLARE_API_TOKEN repository Actions secret is not configured."
          echo "Build and offline tests completed, but the production site was not changed."

      - name: Deploy verified build to existing Cloudflare Pages project
        if: ${{ env.CF_DEPLOY_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 952c8d3018b89940a14f6e9ffe89cef5
          command: pages deploy dist --project-name=glaux-client --branch=work/details-view-20261023
