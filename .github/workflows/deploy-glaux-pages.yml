name: Glaux Client - verified Pages deployment

on:
  workflow_dispatch:
  push:
    branches:
      - work/details-view-20261023
    paths:
      - 'Docs/Plans/GLAUX_DEPLOY_TRIGGER.md'

permissions:
  contents: read

concurrency:
  group: glaux-pages-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact application revision with pinned library
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .dependencies/ogc-client/package-lock.json

      - name: Verify documentation and artifact references
        run: python3 scripts/verify-artifacts.py

      - name: Install pinned dependencies
        run: npm ci

      - name: Type-check application
        run: npm run typecheck

      - name: Run offline tests
        run: npm test

      - name: Build production assets
        run: npm run build

      - name: Record missing credential without exposing one
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "::warning::Cloudflare Pages deploy skipped: set the CLOUDFLARE_API_TOKEN repository Actions secret. Build and tests have still completed."

      - name: Deploy verified build to existing Cloudflare Pages project
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 952c8d3018b89940a14f6e9ffe89cef5
          command: pages deploy dist --project-name=glaux-client --branch=work/details-view-20261023
