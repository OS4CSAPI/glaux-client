name: Publish source-qualified SOSA canonical Excel checkpoint
on:
  push:
    branches:
      - research/dim-profile-v2
    paths:
      - .github/workflows/publish-sosa-d.yml
      - scripts/publish_sosa_d.py
permissions:
  contents: write
concurrency:
  group: sosa-canonical-workbook-publication
  cancel-in-progress: false
jobs:
  publish:
    name: Preserve 26 worksheets and synchronize G2-7E 15 source-qualified SOSA cells
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current research branch
        uses: actions/checkout@v4
        with:
          ref: research/dim-profile-v2
          persist-credentials: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image-preview dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Build SAME original canonical XLSX from source
        run: python scripts/publish_sosa_d.py
      - name: Commit original workbook, source metadata and actual saved-cell validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/Master_Donor_Concept_to_DIM_Crosswalk.json \
            Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/Master_Donor_Concept_to_DIM_Crosswalk.xlsx \
            Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/SOSA_G2_7E_Workbook_Validation_10NOV2026.json \
            Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/SOSA_G2_7E_Workbook_Preview_10NOV2026.png
          if git diff --cached --quiet; then
            echo "FAIL: no workbook publication"; exit 1
          fi
          git commit -m "research(dim-v2): synchronize 15 G2-7E VITA66 source cells in SAME original 26-sheet Excel"
          git push origin HEAD:research/dim-profile-v2
      - name: Read back committed source and actual workbook integrity metadata
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin research/dim-profile-v2
          python - <<'PY'
          import json,hashlib,zipfile
          from pathlib import Path
          d=Path("Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk")
          j=json.loads((d/"Master_Donor_Concept_to_DIM_Crosswalk.json").read_text(encoding="utf-8"))
          v=json.loads((d/"SOSA_G2_7E_Workbook_Validation_10NOV2026.json").read_text(encoding="utf-8"))
          b=(d/"Master_Donor_Concept_to_DIM_Crosswalk.xlsx").read_bytes()
          assert hashlib.sha256(b).hexdigest()==j["currentWorkbookSha256"]==v["workbook_sha256"]
          assert j["workbookSnapshot"]["currently_matches_readable_view"] is True
          assert j["workbookSnapshot"]["refreshed_cell_count"]==15
          assert len(j["columns"])==15 and len(j["rows"])==329
          assert v["G2_7E_qualified_existing_sosa_cells"]==15 and all(v["checks"].values())
          with zipfile.ZipFile(d/"Master_Donor_Concept_to_DIM_Crosswalk.xlsx") as z: assert z.testzip() is None
          print("PASS: saved original 26-sheet workbook SHA/15 source cells/source holds readback")
          PY
