name: Publish source-qualified SAME canonical 26-sheet donor Excel checkpoint
on:
  push:
    branches:
      - research/dim-profile-v2
    paths:
      - .github/workflows/publish-sosa-d.yml
      - scripts/publish_sosa_d.py
permissions:
  contents: write
concurrency:
  group: sosa-canonical-workbook-publication
  cancel-in-progress: false
jobs:
  publish:
    name: Publish verified original 26-sheet crosswalk checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dim-profile-v2
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and publish once (full saved-cell and preserved-sheet checks)
        run: |
          python -m py_compile scripts/publish_sosa_d.py
          python scripts/publish_sosa_d.py
      - name: Commit ALL canonical formats as one coherent publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/Master_Donor_Concept_to_DIM_Crosswalk.json \
            Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/Master_Donor_Concept_to_DIM_Crosswalk.csv \
            Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/Master_Donor_Concept_to_DIM_Crosswalk.md \
            Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/ISA_Correction_Review_07NOV2026.csv \
            Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/ISA_Correction_Review_07NOV2026.md \
            Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/Master_Donor_Concept_to_DIM_Crosswalk.xlsx \
            Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/SOSA_G3_N2_Workbook_Validation_11NOV2026.json \
            Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/SOSA_C2_Workbook_Validation_12NOV2026.json \
            Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/SOSA_C4_Workbook_Validation_12NOV2026.json
          git add Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/F2_5_Workbook_Validation_13NOV2026.json
          git add Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/AAS02_G_Column_Workbook_Validation_13NOV2026.json
          git add Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/AAS01_Original_Source_Corpus_Coverage_13NOV2026.json
          if git diff --cached --quiet; then echo "No new source-qualified canonical workbook publication"; exit 1; fi
          git commit -m "research(dim-v2): AAS02 G source-qualified original 26-sheet XLSX value/color preservation verified"
          git push origin HEAD:research/dim-profile-v2
      - name: Confirm actual remote commit contains published result
        run: |
          git fetch origin research/dim-profile-v2
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/research/dim-profile-v2)"
