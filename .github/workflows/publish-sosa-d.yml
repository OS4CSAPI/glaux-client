name: Temporary SAP03B one-time canonical workbook publication
on:
  push:
    branches: [research/dim-profile-v2]
    paths: [.github/workflows/publish-sosa-d.yml]
permissions:
  contents: write
concurrency:
  group: sosa-canonical-workbook-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dim-profile-v2
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate source-qualified SAP03B into canonical master and original Excel
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, html, io, json, re, subprocess, zipfile, sys
          from pathlib import Path
          from xml.etree import ElementTree as ET
          sys.path.insert(0,"scripts")
          import isa22_closeout as old
          D=Path("Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk")
          ROOT=D.parent
          BOOK=D/"Master_Donor_Concept_to_DIM_Crosswalk.xlsx"
          MASTER=D/"Master_Donor_Concept_to_DIM_Crosswalk.json"
          LEDGER=D/"SAP01_Original_Corpus_Coverage_12NOV2026.json"
          REPORT=D/"SAP03B_Original_Source_Review_12NOV2026.md"
          VALID=D/"SAP03B_Workbook_Validation_12NOV2026.json"
          PREVIOUS_HASH="c9ea898663c29f63c4c427c596e338206c0dfd905b003cb268988f22e92392fe"
          ARCHIVE_SHA="6309f83ccb1ede9ba284704ebf274c9b4a1db253"
          def need(ok,message):
              if not ok: raise AssertionError("SAP03B: "+message)
          def digest(b): return hashlib.sha256(b).hexdigest()
          def save(path,obj): path.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          def prefix(path,header): path.write_text(header+path.read_text(encoding="utf-8"),encoding="utf-8")
          m=json.loads(MASTER.read_text(encoding="utf-8"))
          l=json.loads(LEDGER.read_text(encoding="utf-8"))
          packet=l["SAP03B"]
          mapped=packet["mappings"]
          need(packet["status"].endswith("PUBLICATION_PENDING") and packet["original_table_count"]==27 and len(packet["original_table_ids"])==27,"bounded original audit staged")
          need(len(packet["source_findings"])==19 and len(packet["holds"])==5 and len(mapped)==28,"staged source findings and 28 comparisons")
          need(len({x["row_id"] for x in mapped})==28,"unique stable row IDs")
          need(m["currentEvidenceCheckpoint"]=="SAP03A_BSI_REGISTRATION_TABLES15_TO32_28_CELLS_SAME_XLSX_VERIFIED","correct SAP03A source baseline")
          need(len(m["rows"])==329 and len(m["review_grid"])==346 and len(m["columns"])==15 and len(m["review_sections"])==15,"unchanged source master shape")
          need(m["columns"][6]["key"]=="SAPIENT" and m["columns"][-1]["key"]=="DIM","donor G and DIM rightmost")
          need(len(m["originalDonorEvidence"])==58 and len(m["caseEvidence"])==73 and m["ISAEvidence"]["currentPrimaryReviews"]==480 and m["ISAEvidence"]["specificQuestions"]==6,"prior donor and case evidence")
          grid_before=[r[:] for r in m["review_grid"]]
          by_id={r["row_id"]:r for r in m["rows"]}
          need(len(by_id)==329,"unique original row identifiers")
          updates={}
          for entry in mapped:
              row=by_id[entry["row_id"]]
              matching=[i for i,x in enumerate(grid_before) if x==row["display"]]
              need(len(matching)==1,"stable current display row "+entry["row_id"])
              i=matching[0]
              new=entry["display"]
              need(new!=row["display"][6] and len(new)<=32767,"new qualified SAPIENT text "+entry["row_id"])
              addr="G"+str(i+1)
              need(addr not in updates,"unique G address "+addr)
              updates[addr]=new
              row["display"][6]=new
              m["review_grid"][i][6]=new
              row["SAP03B_source_first_correspondence"]={
                "source_item_ids":entry["source_item_ids"],
                "original_source_table_ids":list(dict.fromkeys(t for fid in entry["source_item_ids"] for t in next(x["table_ids"] for x in packet["source_findings"] if x["id"]==fid))),
                "edition":"BSI Flex 335 v2.0:2024-03 / pinned Dstl v2 244a741c13bcee628f84944aef91e4a66854bd7d",
                "source_grade":"ORIGINAL_BSI_TABLES33_TO59_AND_RELEVANT_NATIVE_PROTO_FIELDS_ENUMS_READ__NOT_COMPILED",
                "relation":entry["relation"],
                "native_meaning":entry["native_meaning"],
                "previous_sapient_cell_value":grid_before[i][6],
                "source_qualified_display":new,
                "negative_equivalence":"Registration capabilities not actual detection, accepted/issued task, commanded hardware, physical equipment type or adopted DIM/Profile content",
                "DIM_Profile_adopted":False,"not_runtime_conformance":True}
          need(len(updates)==28,"28 source-qualified G cells")
          for i in range(346):
              for j in range(15):
                  if j!=6 or ("G"+str(i+1)) not in updates:
                      need(m["review_grid"][i][j]==grid_before[i][j],"no unapproved grid-cell change")
          need([r for i,r in enumerate(m["review_grid"]) if i>1 and i not in set(m["review_sections"])]==[r["display"] for r in m["rows"]],"329 row objects and 15 topic dividers aligned")
          
          # Both exact CSV mirrors (same canonical 346x15 grid)
          f=io.StringIO(newline="")
          w=csv.writer(f,lineterminator="\n")
          w.writerows(m["review_grid"])
          csvdata=f.getvalue()
          for name in ("Master_Donor_Concept_to_DIM_Crosswalk.csv","ISA_Correction_Review_07NOV2026.csv"):
              (D/name).write_text(csvdata,encoding="utf-8")
          need(list(csv.reader(io.StringIO(csvdata)))==m["review_grid"],"canonical vs CSV mirrors")
          
          # Edit exactly the 28 source-bearing G cells in existing readable HTML comparison tables.
          source=(D/"Master_Donor_Concept_to_DIM_Crosswalk.md").read_text(encoding="utf-8")
          begin=source.index("<tbody>")+len("<tbody>")
          end=source.index("</tbody>",begin)
          body=source[begin:end]
          all_rows=list(re.finditer(r"<tr>.*?</tr>",body,re.S))
          need(len(all_rows)==344,"15 dividers and 329 original rows in the readable table")
          parts=[];pos=0;index=2;edited=0
          for match in all_rows:
              parts.append(body[pos:match.start()])
              tr=match.group()
              if '<th colspan="15">' in tr:
                  need(index in m["review_sections"],"section divider unchanged")
              else:
                  cells=list(re.finditer(r"<td>(.*?)</td>",tr,re.S))
                  need(len(cells)==15,"original 15-cell HTML row")
                  need(html.unescape(cells[14].group(1))==grid_before[index][14],"unchanged DIM rightmost row alignment")
                  addr="G"+str(index+1)
                  if addr in updates:
                      c=cells[6]
                      need(html.unescape(c.group(1))==grid_before[index][6],"original readable SAPIENT cell")
                      tr=tr[:c.start()]+"<td>"+html.escape(updates[addr],quote=True)+"</td>"+tr[c.end():]
                      edited+=1
              parts.append(tr);pos=match.end();index+=1
          parts.append(body[pos:])
          need(index==346 and edited==28,"all 28 exact readable cells updated")
          table=source[:begin]+"".join(parts)+source[end:]
          mdhead=("# CURRENT — SAP-03B SAPIENT original Registration Tables33–59 source and SAME Excel verified (12 November 2026)\n\n"
          "**27 original BSI numbered tables** reviewed in SAP03B (cumulative 59/97 table-depth); 19 source findings, five exact new holds and **28 source-qualified existing SAPIENT G-column comparisons**. "
          "All 346×15 saved comparison values agree across one JSON, both CSV, both GitHub-readable Markdown and the SAME 26-sheet Excel, zero cell lag and 42 other ZIP members unchanged. "
          "[Source audit](SAP03B_Original_Source_Review_12NOV2026.md) · [saved workbook proof](SAP03B_Workbook_Validation_12NOV2026.json) · "
          "[pre-SAP03B archive](https://github.com/OS4CSAPI/glaux-client/tree/archive/dim-crosswalk-pre-sap03b-20261112/Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk). "
          "SAPIENT still ACTIVE/SOURCE-INCOMPLETE; ISA six, SOSA nine, prior SAPIENT holds retained; no DIM/Profile/Glaux adoption. "
          "Forecast after SAP03B **low3 / likely4 / high6** additional substantive Proceeds. **ONE NEXT owner Proceed: SAP-04 original Status/Detection, stop before SAP-05.**\n\n---\n\n")
          for name in ("Master_Donor_Concept_to_DIM_Crosswalk.md","ISA_Correction_Review_07NOV2026.md"):
              (D/name).write_text(mdhead+table,encoding="utf-8")
          need((D/"Master_Donor_Concept_to_DIM_Crosswalk.md").read_text()==(D/"ISA_Correction_Review_07NOV2026.md").read_text(),"Markdown exact mirrors")
          
          # Modify only original Master Crosswalk sheet XML of SAME saved 26-sheet workbook.
          before=BOOK.read_bytes()
          need(digest(before)==PREVIOUS_HASH and m["currentWorkbookSha256"]==PREVIOUS_HASH,"prior verified workbook identity")
          with zipfile.ZipFile(io.BytesIO(before)) as z:
              need(z.testzip() is None,"original ZIP CRC")
              sheets=old.sheetpaths(z)
              need(len(sheets)==26 and sheets["Master Crosswalk"]=="xl/worksheets/sheet2.xml","original 26 sheets and Master Crosswalk sheet")
              sheetpath=sheets["Master Crosswalk"]
              root=ET.fromstring(z.read(sheetpath))
              data=root.find(old.q("sheetData"))
              need(data is not None,"Master Crosswalk sheetData")
              existing_rows={r.get("r"):r for r in data if r.tag==old.q("row")}
              for addr,value in updates.items():
                  number=addr[1:]
                  target=existing_rows[number]
                  cells=[c for c in target if c.tag==old.q("c")]
                  cell=next((c for c in cells if c.get("r")==addr),None)
                  if cell is not None:
                      for child in list(cell):cell.remove(child)
                      cell.set("t","inlineStr")
                  else:
                      neighbour=next((c for c in cells if c.get("r") in ("F"+number,"H"+number)),None)
                      attrs={"r":addr,"t":"inlineStr"}
                      if neighbour is not None and neighbour.get("s") is not None:attrs["s"]=neighbour.get("s")
                      cell=ET.Element(old.q("c"),attrs)
                      others=list(target)
                      where=next((i for i,c in enumerate(others) if c.tag==old.q("c") and re.match(r"[A-Z]+",c.get("r","")).group()>"G"),len(others))
                      target.insert(where,cell)
                  text=ET.SubElement(ET.SubElement(cell,old.q("is")),old.q("t"))
                  text.set("{http://www.w3.org/XML/1998/namespace}space","preserve");text.text=value
              replacement=ET.tostring(root,encoding="utf-8",xml_declaration=True)
              untouched={info.filename:(digest(z.read(info.filename)),info.CRC) for info in z.infolist() if info.filename!=sheetpath}
              out=io.BytesIO()
              with zipfile.ZipFile(out,"w") as znew:
                  for info in z.infolist(): znew.writestr(info,replacement if info.filename==sheetpath else z.read(info.filename))
          saved=out.getvalue()
          with zipfile.ZipFile(io.BytesIO(saved)) as z:
              need(z.testzip() is None and old.sheetpaths(z)==sheets and len(z.namelist())==43,"saved CRC and original sheet inventory")
              need(len(untouched)==42,"other original 42 ZIP members")
              for name,(v,crc) in untouched.items():
                  need(digest(z.read(name))==v and z.getinfo(name).CRC==crc,"unchanged ZIP member bytes/CRC: "+name)
              for name in z.namelist():
                  if name.endswith((".xml",".rels")):ET.fromstring(z.read(name))
              for name,sp in sheets.items():
                  sheetroot=ET.fromstring(z.read(sp))
                  need(not any(c.get("t")=="e" for c in sheetroot.iter(old.q("c"))),"Excel error cell in "+name)
          oldcells=old.readcells(before,"Master Crosswalk")
          newcells=old.readcells(saved,"Master Crosswalk")
          for i in range(346):
              for j in range(15):
                  cell=old.coord(i+1,j+1)
                  need(oldcells.get(cell,"")==old.val(grid_before[i][j]),"original saved 5190-cell baseline "+cell)
                  need(newcells.get(cell,"")==old.val(m["review_grid"][i][j]),"new saved 5190-cell parity "+cell)
          diff={c for c in set(oldcells)|set(newcells) if oldcells.get(c,"")!=newcells.get(c,"")}
          need(diff==set(updates),"exactly 28 saved SAPIENT G changes")
          BOOK.write_bytes(saved)
          new_sha=digest(saved)
          need(new_sha!=PREVIOUS_HASH,"new binary was saved")
          
          m["currentWorkbookSha256"]=new_sha
          m["currentEvidenceCheckpoint"]="SAP03B_BSI_REGISTRATION_TABLES33_TO59_28_CELLS_SAME_26_SHEET_XLSX_VERIFIED"
          m["nextOwnerAction"]="SAP03B complete, 27 original BSI Registration tables, 28 source-qualified SAPIENT G cells, and same 26-sheet Excel verified; new owner Proceed only SAP04 Status/Detection Tables60–77, STOP before SAP05."
          m["SAPIENTEvidence"]["SAP03B"]={"status":"ORIGINAL_SOURCE_AUDITED_AND_SAME_XLSX_PARITY_VERIFIED","source_ledger":LEDGER.name,"source_report":REPORT.name,"validation":VALID.name,"original_BSI_tables_read":27,"cumulative_BSI_tables_read":59,"source_findings":19,"new_exact_holds":5,"source_qualified_master_cells":28,"changed_cell_addresses":sorted(diff,key=lambda x:int(x[1:])),"saved_346x15_parity":True,"excel_lag":0,"forecast_remaining":{"low":3,"most_likely":4,"high":6},"next":"SAP04 separate owner Proceed only; no model/Profile adoption","DIM_Profile_adopted":False}
          m["workbookSnapshot"].update({"checkpoint":"SAP03B_BSI_TABLES33_59_SAME_ORIGINAL_XLSX_VERIFIED","sha256":new_sha,"currently_matches_readable_view":True,"lag":"ZERO: saved original 26-sheet workbook parity with one JSON and both CSV and Markdown mirrors","refreshed_cell_count":28,"validation_file":VALID.name})
          save(MASTER,m)
          packet.update({"status":"ORIGINAL_SOURCE_AND_CANONICAL_JSON_CSV_MARKDOWN_SAME_XLSX_VERIFIED","saved_workbook_sha256":new_sha,"saved_workbook_validation_file":VALID.name,"changed_cells":sorted(diff,key=lambda x:int(x[1:])),"excel_lag":0,"previous_archive_sha":ARCHIVE_SHA,"source_complete":False,"next":"SAP04 only on separate owner Proceed; STOP before SAP05"})
          save(LEDGER,l)
          validation={"date":"2026-11-12","step":"SAP03B_BSI_REGISTRATION_TABLES33_59","result":"SAVED_SAME_ORIGINAL_26_SHEET_XLSX_CELL_PARITY_PASS","source_packet_commit":"62f9b43401f14455995714e1b12a51705068f8e0","pre_SAP03B_archive":"archive/dim-crosswalk-pre-sap03b-20261112","pre_SAP03B_HEAD":ARCHIVE_SHA,"prior_workbook_sha256":PREVIOUS_HASH,"workbook_sha256":new_sha,"original_sheets":26,"current_sheets":26,"grid_rows":346,"grid_columns":15,"validated_saved_cells":5190,"only_changed_sheet":"Master Crosswalk xl/worksheets/sheet2.xml","other_ZIP_members_unchanged":42,"exact_changed_G_cells":sorted(diff,key=lambda x:int(x[1:])),"original_numbered_tables_read_this_step":27,"cumulative_original_numbered_tables_read":59,"original_numbered_tables_in_BSI":97,"source_findings":19,"source_holds_added":5,"original_proto_compilation":False,"source_complete":False,"ISA_six_original_questions_held":True,"SOSA_nine_owner_accepted_partial_holds_held":True,"prior_SAPIENT_issues_held":True,"DIM_CSAPI_Profile_adopted":False,"checks":{"all_5190_master_XLSX_saved_cell_values_equal_JSON":True,"exact_28_G_changes_only":True,"four_case_and_OGC_and_DIM_columns_unchanged":True,"both_CSV_mirrors_exact":True,"both_Markdown_views_exact":True,"all_26_original_sheets":True,"other_42_ZIP_members_unmodified":True,"ZIP_CRC_and_XML_valid":True,"no_excel_error_values":True},"next":"SAP04 only on owner Proceed, stop before SAP05"}
          save(VALID,validation)
          
          header=("# CURRENT — SAP-03B ORIGINAL BSI REGISTRATION TABLES33–59 AND SAME EXCEL VERIFIED (12 November 2026)\n\n"
          "**SAP-03B COMPLETE, independently saved-check verified.** Original BSI Flex 335 v2.0 §§6.2.5.16–6.2.5.41/Tables33–59 (27 table-level audits; cumulative 59/97), pinned relevant registration/follow/region native source, 19 original findings and five new exact source holds. "
          "**28 existing SAPIENT G-column source comparisons** updated in canonical JSON, both CSV, both GitHub-readable Markdown comparisons and SAME original editable 26-sheet Excel. All **346×15 saved values** match, only G changed and 42 ZIP members/other 25 worksheets preserved, **zero Excel lag**. "
          "[Research](SAP03B_Original_Source_Review_12NOV2026.md) · [source ledger](SAP01_Original_Corpus_Coverage_12NOV2026.json) · [saved validation](SAP03B_Workbook_Validation_12NOV2026.json) · "
          "[original pre-SAP03B version](https://github.com/OS4CSAPI/glaux-client/tree/archive/dim-crosswalk-pre-sap03b-20261112/Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/). "
          "ISA six source questions, The Open Group SOSA PARTIAL—OWNER ACCEPTED/nine source-hold groups, existing SAPIENT six+five+three holds plus five new SAP03B holds remain open; SAPIENT ACTIVE/SOURCE-INCOMPLETE. "
          "Forecast remaining **low3 / likely4 / high6 substantive Proceeds**. No DIM/Profile adoption, real command, Glaux/client or deployment. **ONE NEXT separate owner Proceed: SAP-04 ONLY BSI §§6.3–6.4 Tables60–77, stop before SAP05.**\n\n---\n\n")
          for path in (D/"PITON_Donor_Concept_to_DIM_Crosswalk_v0.1_05NOV2026.md",
                       D/"PLAN_Donor_Concept_to_DIM_Master_Crosswalk_v0.1_05NOV2026.md",
                       D/"PLAN_SAPIENT_v2_Source_First_Donor_Review_v0.1_12NOV2026.md",D/"README.md"):
              prefix(path,header)
          prefix(ROOT/"README.md",header.replace("(SAP03B_Original_Source_Review_12NOV2026.md)","(Donor_DIM_Crosswalk/SAP03B_Original_Source_Review_12NOV2026.md)").replace("(SAP01_Original_Corpus_Coverage_12NOV2026.json)","(Donor_DIM_Crosswalk/SAP01_Original_Corpus_Coverage_12NOV2026.json)").replace("(SAP03B_Workbook_Validation_12NOV2026.json)","(Donor_DIM_Crosswalk/SAP03B_Workbook_Validation_12NOV2026.json)"))
          prefix(REPORT,"**FINAL SOURCE/CANONICAL/SAVED-EXCEL PUBLICATION PASS:** 28 exact SAPIENT G-column source-qualified updates in canonical JSON/both CSV/both Markdown and SAME original 26-sheet workbook, 5190 actual saved values and zero lag. [Saved validation](SAP03B_Workbook_Validation_12NOV2026.json). The original source report below was prepared before this workbook gate; its publication-pending statements are historical.\n\n")
          prefix(D/"LESSONS_Donor_Review_Process.md",
          "# L70 — registration schemas declare possibilities; task wire tags and taxonomy do not equal equipment identity (12 November 2026)\n\n"
          "Reviewing all BSI v2 Registration Tables33–59 alongside pinned native registration/follow/related task message definitions established a reliable distinction between declared detection/report/classification/behaviour capabilities, accepted task/region/command types and *actual* detections, sent tasks, acknowledged outcomes or physical execution. SAPIENT ClassDefinition and namespaced taxonomy docking describe detected objects, not a universal physical sensor hierarchy; Location/VelocityType/RegionType/FollowObject are source-scoped and do not prove observed installation. Table58 CommandType enum codes and Task.Command field tags are *different encoding levels*; original source requiredness and pinned optional/validation annotations also differ. Keep exact holds rather than fake compatible wire tags or Profile rules. Integrate only justified existing master row comparisons, then check the saved SAME original workbook before claiming zero lag; after 27 original table-depth reads, whole SAPIENT source completeness is still open. [SAP03B original-source review](SAP03B_Original_Source_Review_12NOV2026.md) · [SAME Excel validation](SAP03B_Workbook_Validation_12NOV2026.json).\n\n---\n")
          print("SAP03B canonical publication PASS; 28 SAPIENT G changes and 5190 saved cells; XLSX",new_sha)
          
          # Restore existing reusable workflow, leaving no new workflow infrastructure.
          wf=Path(".github/workflows/publish-sosa-d.yml")
          original=subprocess.check_output(["git","show","HEAD^:.github/workflows/publish-sosa-d.yml"])
          wf.write_bytes(original)
          files=[str(wf),str(MASTER),str(BOOK),str(LEDGER),str(REPORT),str(VALID),
           str(D/"Master_Donor_Concept_to_DIM_Crosswalk.csv"),str(D/"ISA_Correction_Review_07NOV2026.csv"),
           str(D/"Master_Donor_Concept_to_DIM_Crosswalk.md"),str(D/"ISA_Correction_Review_07NOV2026.md"),
           str(D/"PITON_Donor_Concept_to_DIM_Crosswalk_v0.1_05NOV2026.md"),
           str(D/"PLAN_Donor_Concept_to_DIM_Master_Crosswalk_v0.1_05NOV2026.md"),
           str(D/"PLAN_SAPIENT_v2_Source_First_Donor_Review_v0.1_12NOV2026.md"),
           str(D/"README.md"),str(ROOT/"README.md"),str(D/"LESSONS_Donor_Review_Process.md")]
          subprocess.run(["git","add",*files],check=True)
          
          PY
      - name: Commit saved canonical outputs and restore prior workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && { echo 'No SAP03B publication'; exit 1; } || true
          git commit -m "research(dim-v2): SAP03B 27 source tables, 28 existing G cells, same XLSX parity [skip ci]"
          git push origin HEAD:research/dim-profile-v2
          git fetch origin research/dim-profile-v2
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/research/dim-profile-v2)"
