name: Temporary SAP06 one-time canonical workbook publication
on:
  push:
    branches: [research/dim-profile-v2]
    paths: [.github/workflows/publish-sosa-d.yml]
permissions:
  contents: write
concurrency:
  group: sosa-canonical-workbook-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dim-profile-v2
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate source-qualified SAP06 into canonical master and original Excel
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, html, io, json, re, subprocess, zipfile, sys
          from pathlib import Path
          from xml.etree import ElementTree as ET
          sys.path.insert(0,"scripts")
          import isa22_closeout as old
          D=Path("Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk")
          ROOT=D.parent
          BOOK=D/"Master_Donor_Concept_to_DIM_Crosswalk.xlsx"
          MASTER=D/"Master_Donor_Concept_to_DIM_Crosswalk.json"
          LEDGER=D/"SAP01_Original_Corpus_Coverage_12NOV2026.json"
          REPORT=D/"SAP06_Original_Source_Review_13NOV2026.md"
          VALID=D/"SAP06_Workbook_Validation_13NOV2026.json"
          PREVIOUS_HASH="490eab4ac6cc3d43bf755a004b6f584614b0ad57b16fba8ff130f773238d5334"
          ARCHIVE_SHA="3ec4c12b4f821c0835e65213ee2fab8353fabd56"
          def need(ok,message):
              if not ok: raise AssertionError("SAP06: "+message)
          def digest(b): return hashlib.sha256(b).hexdigest()
          def save(path,obj): path.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          def prefix(path,header): path.write_text(header+path.read_text(encoding="utf-8"),encoding="utf-8")
          m=json.loads(MASTER.read_text(encoding="utf-8"))
          l=json.loads(LEDGER.read_text(encoding="utf-8"))
          packet=l["SAP06"]
          mapped=packet["master_mappings"]
          need(packet["status"].endswith("PUBLICATION_PENDING") and packet["original_main_tables_inspected_new"]==2 and packet["original_main_tables_inspected_cumulative"]==97,"original taxonomy and annex packet staged")
          need(len(packet["source_findings"])==20 and len(packet["new_source_holds"])==6 and len(mapped)==26 and len(packet["annex_coverage"])==6,"staged 20 source findings, six holds, six annex section groups and 26 master cells")
          need(len({x["row_id"] for x in mapped})==26,"unique stable row IDs")
          need(m["currentEvidenceCheckpoint"]=="SAP05_BSI_TASK_ALERT_ERROR_TABLES78_TO95_42_CELLS_SAME_26_SHEET_XLSX_VERIFIED","correct SAP03A source baseline")
          need(len(m["rows"])==329 and len(m["review_grid"])==346 and len(m["columns"])==15 and len(m["review_sections"])==15,"unchanged source master shape")
          need(m["columns"][6]["key"]=="SAPIENT" and m["columns"][-1]["key"]=="DIM","donor G and DIM rightmost")
          need(len(m["originalDonorEvidence"])==58 and len(m["caseEvidence"])==73 and m["ISAEvidence"]["currentPrimaryReviews"]==480 and m["ISAEvidence"]["specificQuestions"]==6,"prior donor and case evidence")
          grid_before=[r[:] for r in m["review_grid"]]
          by_id={r["row_id"]:r for r in m["rows"]}
          need(len(by_id)==329,"unique original row identifiers")
          updates={}
          for entry in mapped:
              row=by_id[entry["row_id"]]
              matching=[i for i,x in enumerate(grid_before) if x==row["display"]]
              need(len(matching)==1,"stable current display row "+entry["row_id"])
              i=matching[0]
              new=entry["display"]
              need(new!=row["display"][6] and len(new)<=32767,"new qualified SAPIENT text "+entry["row_id"])
              addr="G"+str(i+1)
              need(addr not in updates,"unique G address "+addr)
              updates[addr]=new
              row["display"][6]=new
              m["review_grid"][i][6]=new
              row["SAP06_source_first_correspondence"]={
                "source_item_ids":entry["source_item_ids"],
          "original_source_locators":list(dict.fromkeys(t for fid in entry["source_item_ids"] for t in [next(x["locator"] for x in packet["source_findings"] if x["id"]==fid)])),
                "edition":"BSI Flex 335 v2.0:2024-03 / pinned Dstl v2 244a741c13bcee628f84944aef91e4a66854bd7d",
                "source_grade":"ORIGINAL_BSI_TAXONOMY_TABLES96_97_ANNEXES_A_D_AND_RELEVANT_NATIVE_PROTOS_READ_NOT_COMPILED",
                "relation":entry["relation"],
                "native_meaning":entry["native_meaning"],
                "previous_sapient_cell_value":grid_before[i][6],
                "source_qualified_display":new,
                "negative_equivalence":"SAPIENT detected-object taxonomy and informative Annex integrations do not establish physical equipment taxonomy, observed vendor installation, standard video streaming or adopted DIM/Profile models",
                "DIM_Profile_adopted":False,"not_runtime_conformance":True}
          need(len(updates)==26,"26 source-qualified G cells")
          for i in range(346):
              for j in range(15):
                  if j!=6 or ("G"+str(i+1)) not in updates:
                      need(m["review_grid"][i][j]==grid_before[i][j],"no unapproved grid-cell change")
          need([r for i,r in enumerate(m["review_grid"]) if i>1 and i not in set(m["review_sections"])]==[r["display"] for r in m["rows"]],"329 row objects and 15 topic dividers aligned")
          
          # Both exact CSV mirrors (same canonical 346x15 grid)
          f=io.StringIO(newline="")
          w=csv.writer(f,lineterminator="\n")
          w.writerows(m["review_grid"])
          csvdata=f.getvalue()
          for name in ("Master_Donor_Concept_to_DIM_Crosswalk.csv","ISA_Correction_Review_07NOV2026.csv"):
              (D/name).write_text(csvdata,encoding="utf-8")
          need(list(csv.reader(io.StringIO(csvdata)))==m["review_grid"],"canonical vs CSV mirrors")
          
          # Edit exactly the 40 source-bearing G cells in existing readable HTML comparison tables.
          source=(D/"Master_Donor_Concept_to_DIM_Crosswalk.md").read_text(encoding="utf-8")
          begin=source.index("<tbody>")+len("<tbody>")
          end=source.index("</tbody>",begin)
          body=source[begin:end]
          all_rows=list(re.finditer(r"<tr>.*?</tr>",body,re.S))
          need(len(all_rows)==344,"15 dividers and 329 original rows in the readable table")
          parts=[];pos=0;index=2;edited=0
          for match in all_rows:
              parts.append(body[pos:match.start()])
              tr=match.group()
              if '<th colspan="15">' in tr:
                  need(index in m["review_sections"],"section divider unchanged")
              else:
                  cells=list(re.finditer(r"<td>(.*?)</td>",tr,re.S))
                  need(len(cells)==15,"original 15-cell HTML row")
                  need(html.unescape(cells[14].group(1))==grid_before[index][14],"unchanged DIM rightmost row alignment")
                  addr="G"+str(index+1)
                  if addr in updates:
                      c=cells[6]
                      need(html.unescape(c.group(1))==grid_before[index][6],"original readable SAPIENT cell")
                      tr=tr[:c.start()]+"<td>"+html.escape(updates[addr],quote=True)+"</td>"+tr[c.end():]
                      edited+=1
              parts.append(tr);pos=match.end();index+=1
          parts.append(body[pos:])
          need(index==346 and edited==26,"all 26 exact readable cells updated")
          table=source[:begin]+"".join(parts)+source[end:]
          mdhead=("# CURRENT — SAP-06 BSI original §7 Taxonomy and Annexes A–D, SAME editable 26-sheet Excel verified (13 November 2026)\n\n"
          "**97 of 97 BSI numbered main tables** now have bounded original-content readings; §7 taxonomy, full Tables96–97, Figure7 and informative Annexes A–D/Table C.1 directly inspected. "
          "**20 stable source findings, six new exact holds and 26 existing SAPIENT G-column comparisons** integrated into canonical JSON, BOTH CSV mirrors, BOTH GitHub-readable Markdown comparisons and SAME original editable 26-sheet XLSX. "
          "All **346×15=5,190 actual saved worksheet cells** match; 42 ZIP members / other 25 sheets preserved, zero Excel lag. "
          "[Original evidence](SAP06_Original_Source_Review_13NOV2026.md) · [independent saved-cell record](SAP06_Workbook_Validation_13NOV2026.json) · [pre-SAP06 full original](https://github.com/OS4CSAPI/glaux-client/tree/archive/dim-crosswalk-pre-sap06-20261113/Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk). "
          "This does **not** establish every normative clause, external companion, original-byte hash, all figures, physical runtime conformance or donor completeness. "
          "SAPIENT ACTIVE, holds retained, **no DIM/Profile adoption**. Remaining substantive Proceeds low1/likely1/high3. **Next new owner Proceed: SAP07 source coverage and owner-disposition packet only, then STOP.**\n\n---\n\n")
          for name in ("Master_Donor_Concept_to_DIM_Crosswalk.md","ISA_Correction_Review_07NOV2026.md"):
              (D/name).write_text(mdhead+table,encoding="utf-8")
          need((D/"Master_Donor_Concept_to_DIM_Crosswalk.md").read_text()==(D/"ISA_Correction_Review_07NOV2026.md").read_text(),"Markdown exact mirrors")
          
          # Modify only original Master Crosswalk sheet XML of SAME saved 26-sheet workbook.
          before=BOOK.read_bytes()
          need(digest(before)==PREVIOUS_HASH and m["currentWorkbookSha256"]==PREVIOUS_HASH,"prior verified workbook identity")
          with zipfile.ZipFile(io.BytesIO(before)) as z:
              need(z.testzip() is None,"original ZIP CRC")
              sheets=old.sheetpaths(z)
              need(len(sheets)==26 and sheets["Master Crosswalk"]=="xl/worksheets/sheet2.xml","original 26 sheets and Master Crosswalk sheet")
              sheetpath=sheets["Master Crosswalk"]
              root=ET.fromstring(z.read(sheetpath))
              data=root.find(old.q("sheetData"))
              need(data is not None,"Master Crosswalk sheetData")
              existing_rows={r.get("r"):r for r in data if r.tag==old.q("row")}
              for addr,value in updates.items():
                  number=addr[1:]
                  target=existing_rows[number]
                  cells=[c for c in target if c.tag==old.q("c")]
                  cell=next((c for c in cells if c.get("r")==addr),None)
                  if cell is not None:
                      for child in list(cell):cell.remove(child)
                      cell.set("t","inlineStr")
                  else:
                      neighbour=next((c for c in cells if c.get("r") in ("F"+number,"H"+number)),None)
                      attrs={"r":addr,"t":"inlineStr"}
                      if neighbour is not None and neighbour.get("s") is not None:attrs["s"]=neighbour.get("s")
                      cell=ET.Element(old.q("c"),attrs)
                      others=list(target)
                      where=next((i for i,c in enumerate(others) if c.tag==old.q("c") and re.match(r"[A-Z]+",c.get("r","")).group()>"G"),len(others))
                      target.insert(where,cell)
                  text=ET.SubElement(ET.SubElement(cell,old.q("is")),old.q("t"))
                  text.set("{http://www.w3.org/XML/1998/namespace}space","preserve");text.text=value
              replacement=ET.tostring(root,encoding="utf-8",xml_declaration=True)
              untouched={info.filename:(digest(z.read(info.filename)),info.CRC) for info in z.infolist() if info.filename!=sheetpath}
              out=io.BytesIO()
              with zipfile.ZipFile(out,"w") as znew:
                  for info in z.infolist(): znew.writestr(info,replacement if info.filename==sheetpath else z.read(info.filename))
          saved=out.getvalue()
          with zipfile.ZipFile(io.BytesIO(saved)) as z:
              need(z.testzip() is None and old.sheetpaths(z)==sheets and len(z.namelist())==43,"saved CRC and original sheet inventory")
              need(len(untouched)==42,"other original 42 ZIP members")
              for name,(v,crc) in untouched.items():
                  need(digest(z.read(name))==v and z.getinfo(name).CRC==crc,"unchanged ZIP member bytes/CRC: "+name)
              for name in z.namelist():
                  if name.endswith((".xml",".rels")):ET.fromstring(z.read(name))
              for name,sp in sheets.items():
                  sheetroot=ET.fromstring(z.read(sp))
                  need(not any(c.get("t")=="e" for c in sheetroot.iter(old.q("c"))),"Excel error cell in "+name)
          oldcells=old.readcells(before,"Master Crosswalk")
          newcells=old.readcells(saved,"Master Crosswalk")
          for i in range(346):
              for j in range(15):
                  cell=old.coord(i+1,j+1)
                  need(oldcells.get(cell,"")==old.val(grid_before[i][j]),"original saved 5190-cell baseline "+cell)
                  need(newcells.get(cell,"")==old.val(m["review_grid"][i][j]),"new saved 5190-cell parity "+cell)
          diff={c for c in set(oldcells)|set(newcells) if oldcells.get(c,"")!=newcells.get(c,"")}
          need(diff==set(updates),"exactly 26 saved SAPIENT G changes")
          BOOK.write_bytes(saved)
          new_sha=digest(saved)
          need(new_sha!=PREVIOUS_HASH,"new binary was saved")
          
          m["currentWorkbookSha256"]=new_sha
          m["currentEvidenceCheckpoint"]="SAP06_BSI_TAXONOMY_ANNEXES_MAIN_TABLES97_97_26_CELLS_SAME_26_SHEET_XLSX_VERIFIED"
          m["nextOwnerAction"]="SAP06 completed original BSI §7/Tables96–97 and informative Annexes A–D; 26 SAPIENT G comparisons and SAME 26-sheet Excel verified. ONE NEXT separate owner Proceed authorizes SAP07 original-source coverage/hold gate and owner donor disposition packet ONLY. STOP before donor transition or DIM/Profile/client adoption."
          m["SAPIENTEvidence"]["SAP06"]={"status":"ORIGINAL_TAXONOMY_ANNEXES_REVIEWED_SAME_XLSX_PARITY_VERIFIED__DONOR_ACTIVE","source_ledger":LEDGER.name,"source_report":REPORT.name,"validation":VALID.name,"original_BSI_main_tables_audited_this_step":2,"cumulative_BSI_main_tables_at_bounded_content_depth":97,"annex_section_groups_read":6,"source_findings":20,"new_exact_holds":6,"source_qualified_master_cells":26,"changed_cell_addresses":sorted(diff,key=lambda x:int(x[1:])),"saved_346x15_parity":True,"excel_lag":0,"source_complete":False,"owner_disposition_pending":True,"forecast_remaining":{"low":1,"most_likely":1,"high":3},"next":"SAP07 source coverage gate and owner decision packet only, on separate Proceed","DIM_Profile_adopted":False}
          m["workbookSnapshot"].update({"checkpoint":"SAP06_BSI_TAXONOMY_ANNEX_A_D_97_TABLE_SOURCE_DEPTH_SAME_ORIGINAL_XLSX_VERIFIED","sha256":new_sha,"currently_matches_readable_view":True,"lag":"ZERO: saved original 26-sheet workbook parity with one JSON and both CSV and Markdown mirrors","refreshed_cell_count":26,"validation_file":VALID.name})
          save(MASTER,m)
          packet.update({"status":"SOURCE_REVIEWED_CANONICAL_JSON_BOTH_CSV_BOTH_MARKDOWN_SAME_XLSX_SAVED_PARITY_VERIFIED__DONOR_OPEN","canonical_status":"VERIFIED_ZERO_LAG","saved_workbook_sha256":new_sha,"saved_workbook_validation_file":VALID.name,"changed_cells":sorted(diff,key=lambda x:int(x[1:])),"excel_lag":0,"previous_archive_sha":ARCHIVE_SHA,"source_complete":False,"next":"SAP07 original-source coverage audit and owner-disposition packet on a NEW owner Proceed ONLY; STOP before donor transition."})
          save(LEDGER,l)
          validation={"date":"2026-11-13","step":"SAP06_BSI_TAXONOMY_ANNEXES_A_D","result":"SAVED_SAME_ORIGINAL_26_SHEET_XLSX_CELL_PARITY_PASS","source_packet_commit":"998d3d94d3832d2d18381b894998b799f7edee97","pre_SAP06_archive":"archive/dim-crosswalk-pre-sap06-20261113","pre_SAP06_HEAD":ARCHIVE_SHA,"prior_workbook_sha256":PREVIOUS_HASH,"workbook_sha256":new_sha,"original_sheets":26,"current_sheets":26,"grid_rows":346,"grid_columns":15,"validated_saved_cells":5190,"only_changed_sheet":"Master Crosswalk xl/worksheets/sheet2.xml","other_ZIP_members_unchanged":42,"exact_changed_G_cells":sorted(diff,key=lambda x:int(x[1:])),"original_numbered_tables_read_this_step":2,"cumulative_original_numbered_tables_read_at_content_depth":97,"original_numbered_tables_in_BSI":97,"original_annex_groups_read":6,"source_findings":20,"source_holds_added":6,"original_proto_compilation":False,"whole_source_completeness":False,"owner_disposition_required":True,"ISA_six_original_questions_held":True,"SOSA_nine_owner_accepted_partial_holds_held":True,"prior_SAPIENT_issues_held":True,"DIM_CSAPI_Profile_adopted":False,"checks":{"all_5190_master_XLSX_saved_cell_values_equal_JSON":True,"exact_26_G_changes_only":True,"four_case_and_OGC_and_DIM_columns_unchanged":True,"both_CSV_mirrors_exact":True,"both_Markdown_views_exact":True,"all_26_original_sheets":True,"other_42_ZIP_members_unmodified":True,"ZIP_CRC_and_XML_valid":True,"no_excel_error_values":True},"next":"SAP07 original source completeness/owner disposition gate on owner Proceed; STOP before donor transition"}
          save(VALID,validation)
          
          header=("# CURRENT — SAP06 TAXONOMY / ANNEXES A–D SOURCE AND SAME EXCEL VERIFIED (13 November 2026)\n\n"
          "**SAP06 COMPLETE within BSI §7 and informative Annexes A–D scope:** source original Table96 target taxonomy, Table97 behaviours, Figure7, source Annex A–D and informative C.1 bitrate table audited; main numbered BSI source-table contact is **97/97 at bounded content depth**, NOT full entire-corpus conformance. "
          "**20 source findings, six exact new holds, 26 source-qualified existing SAPIENT G-cell comparisons** published in canonical JSON, BOTH CSV mirrors, BOTH Markdown comparisons and SAME original editable **26-sheet Excel**. All 346×15 saved cells verified, only G changed; other 25 worksheets/42 ZIP members preserved, zero lag. "
          "[SAP06 source review](SAP06_Original_Source_Review_13NOV2026.md) · [cumulative original-source ledger](SAP01_Original_Corpus_Coverage_12NOV2026.json) · [saved Excel verification](SAP06_Workbook_Validation_13NOV2026.json) · [preserved pre-SAP06 originals](https://github.com/OS4CSAPI/glaux-client/tree/archive/dim-crosswalk-pre-sap06-20261113/Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk). "
          "ISO/OGC mappings, physical sensor/equipment identities, class hierarchies and CSAPI Profile requirements remain **NOT ADOPTED**. ISA six original questions, The Open Group SOSA PARTIAL—OWNER ACCEPTED/nine source-hold families and SAPIENT exact holds persist; original Annex D external references and no native compilation/runtime tests prevent comprehensive claims. "
          "SAPIENT remains ACTIVE, **low1 / most likely1 / high3** further substantive owner Proceeds. **ONE NEXT separate owner Proceed = SAP07 source coverage, mapping/hold audit and owner donor-disposition packet ONLY. STOP before a new donor, a DIM/Profile model decision, any Glaux/client change or deployment.**\n\n---\n\n")
          for path in (D/"PITON_Donor_Concept_to_DIM_Crosswalk_v0.1_05NOV2026.md",
                       D/"PLAN_Donor_Concept_to_DIM_Master_Crosswalk_v0.1_05NOV2026.md",
                       D/"PLAN_SAPIENT_v2_Source_First_Donor_Review_v0.1_12NOV2026.md",D/"README.md"):
              prefix(path,header)
          prefix(ROOT/"README.md",header.replace("(SAP06_Original_Source_Review_12NOV2026.md)","(Donor_DIM_Crosswalk/SAP06_Original_Source_Review_12NOV2026.md)").replace("(SAP01_Original_Corpus_Coverage_12NOV2026.json)","(Donor_DIM_Crosswalk/SAP01_Original_Corpus_Coverage_12NOV2026.json)").replace("(SAP06_Workbook_Validation_12NOV2026.json)","(Donor_DIM_Crosswalk/SAP06_Workbook_Validation_12NOV2026.json)"))
          prefix(REPORT,"**FINAL SAP06 CANONICAL/SAVED-EXCEL PUBLICATION PASS:** 26 original source-qualified SAPIENT column-G comparisons saved across canonical JSON, both CSV mirrors, both Markdown views and SAME original 26-sheet Excel. All 5,190 saved cells verified with zero lag and 42 other ZIP members untouched. [Original saved-workbook validation](SAP06_Workbook_Validation_13NOV2026.json). The source-first proposal and publication-pending wording below document the preceding staged state.\n\n")
          prefix(D/"LESSONS_Donor_Review_Process.md",
          "# L73 — taxonomy of detected targets is not a physical equipment chassis; informative examples are not conformance fixtures (13 November 2026)\n\n"
          "BSI Flex 335 v2 §7/Table96 includes Equipment/Passive sensor/Camera in a taxonomy of **detected objects**, not the inventory of connected sensor equipment. Table97 Active/Passive are behaviours of detected objects, not a live sensor status flag. Namespaced class extensions and Annex D OWL/SKOS/DTIC/NATO references are scoped examples, not imported universal DIM classes; restricted AINTP-03 original unexamined. Annex C explicitly excludes standardized streaming video and leaves file storage to local arrangements. Annex B is informative, and its TaskAck/Alert/Registration samples conflict with main required status/ULID/removed field rules. Preserve these exact original-source holds with edition/access grades instead of guessing corrections. Source table-depth count 97/97 does not establish full original-clause/companion/runtime completeness; keep donor open for SAP07 owner disposition. As always, update one master, both CSV/Markdown comparisons and SAME 26-sheet editable Excel, verifying actual saved cells. [Source report](SAP06_Original_Source_Review_13NOV2026.md) · [saved workbook proof](SAP06_Workbook_Validation_13NOV2026.json).\n\n---\n")
          print("SAP06 original taxonomy and Annexes A–D publication PASS; 26 G-cell changes, 5,190 saved cells, same Excel SHA256",new_sha)
          # Stage only researched content: GitHub Actions lacks workflow-file mutation permission.
          # Restore the original workflow separately through the authorized GitHub connector.
          files=[str(MASTER),str(BOOK),str(LEDGER),str(REPORT),str(VALID),
           str(D/"Master_Donor_Concept_to_DIM_Crosswalk.csv"),str(D/"ISA_Correction_Review_07NOV2026.csv"),
           str(D/"Master_Donor_Concept_to_DIM_Crosswalk.md"),str(D/"ISA_Correction_Review_07NOV2026.md"),
           str(D/"PITON_Donor_Concept_to_DIM_Crosswalk_v0.1_05NOV2026.md"),
           str(D/"PLAN_Donor_Concept_to_DIM_Master_Crosswalk_v0.1_05NOV2026.md"),
           str(D/"PLAN_SAPIENT_v2_Source_First_Donor_Review_v0.1_12NOV2026.md"),
           str(D/"README.md"),str(ROOT/"README.md"),str(D/"LESSONS_Donor_Review_Process.md")]
          subprocess.run(["git","add",*files],check=True)
          
          PY
      - name: Commit source and saved canonical workbook without workflow mutation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && { echo 'No SAP06 publication'; exit 1; } || true
          git commit -m "research(dim-v2): SAP06 taxonomy and annexes, 26 G cells, same XLSX parity [skip ci]"
          git push origin HEAD:research/dim-profile-v2
          git fetch origin research/dim-profile-v2
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/research/dim-profile-v2)"
