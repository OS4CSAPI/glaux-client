name: Publish and verify reviewed ISA checkpoint
on:
  push:
    branches: [research/dim-profile-v2]
    paths:
      - Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/.isa_review_text_update.txt
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isa-reviewed-text-publication
  cancel-in-progress: false
env:
  VERIFY_ISA_TEXT: |
    import subprocess
    baseline='fd9a83af27887ea32360e7889eb1dc7736393cc6'
    subprocess.run(['git','fetch','--no-tags','--depth=1','origin',baseline],check=True)
    source=subprocess.check_output(['git','show',baseline+':.github/workflows/publish-isa03d-checkpoint.yml']).decode()
    lines=source.split('  VERIFY_ISA_TEXT: |\n',1)[1].split('\njobs:\n',1)[0].splitlines()
    code='\n'.join(line[4:] for line in lines)
    needle="    exact=all(Path(n).is_file() and sha(Path(n).read_bytes())==v['sha256'] for n,v in p['files'].items())"
    fix="""    # Reconstruct reviewed CSV bytes from the signed payload, validate them first,
        # then apply only Git's CRLF-to-LF text normalization before exact-byte checks.
        for name,v in p['files'].items():
            if Path(name).suffix=='.csv':
                original=subprocess.check_output(['git','show',p['base_commit']+':'+v['base']])
                assert sha(original)==v['base_sha256'],'CSV baseline mismatch'
                authored=b''.join(original[o['copy'][0]:sum(o['copy'])] if 'copy' in o else o['text'].encode('utf-8') for o in v['ops'])
                assert sha(authored)==v['sha256'] and len(authored)==v['size'],'Reviewed CSV payload mismatch'
                normalized=authored.replace(b'\r\n',b'\n')
                assert len(normalized)==73797 and sha(normalized)=='bdf8a21e5996c9ce39e3c9302aecb198cd0abfc0cf885765f89674bd323fecd7','Unexpected CSV normalization'
                v.clear();v.update(kind='text_delta',text=normalized.decode('utf-8'),sha256=sha(normalized),size=len(normalized))
    """
    # Escape sequences in the inserted source must remain source text, not literal newlines.
    fix=fix.replace("b'\r\n'", "b'\\r\\n'").replace("b'\n'", "b'\\n'")
    assert code.count(needle)==1,'Unexpected existing verifier'
    code=code.replace(needle,fix+'\n'+needle)
    exec(compile(code,'<existing verifier with exact Git-normalized CSV bytes>','exec'))
jobs:
  publish:
    name: Commit reviewed ISA checkpoint using existing assembler
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      checkpoint: ${{ steps.commit.outputs.checkpoint }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply exact reviewed artifacts and check preservation
        env:
          APPLY_ISA_TEXT: '1'
        run: python3 -c "$VERIFY_ISA_TEXT"
      - name: Commit authorized research artifacts only
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check -- . ':!Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/README.md'
          git -c core.whitespace=-blank-at-eol diff --cached --check -- Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/README.md
          python3 -c "from pathlib import Path; p=Path('Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/README.md'); assert all(not line[len(line.rstrip()):] or (line.endswith('  ') and len(line)-len(line.rstrip())==2 and bool(line.rstrip())) for line in p.read_text().splitlines()), 'Unexpected README whitespace'"
          if ! git diff --cached --quiet; then
            git commit -m 'research(dim-v2): publish verified current ISA checkpoint and recovery routing'
            git push origin HEAD:research/dim-profile-v2
          fi
          echo "checkpoint=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify-published:
    name: Read-only verification of exact published ISA checkpoint
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.checkpoint }}
          persist-credentials: false
      - name: Verify committed workbook or source checkpoint and prior preservation
        run: python3 -c "$VERIFY_ISA_TEXT"
      - name: Record checked commit
        run: echo 'Verified ISA checkpoint ${{ needs.publish.outputs.checkpoint }}'
