                if k not in {'display_row','additional_ISA_context_evidence'}:assert rows[key][k]==v,(key,k)
            refs=row.get('additional_ISA_context_evidence',[])
            assert rows[key].get('additional_ISA_context_evidence',[])[:len(refs)]==refs
            assert set(rows[key])<=set(row)|{'display_row','additional_ISA_context_evidence'},key
        assert all(row['display']==grid[row['display_row']-6] for row in m['rows'])
        assert all(key in rows for x in records+companion_records for key in x['target_rows'])
        for k in ['columns','originalDonorEvidence','caseEvidence','priorHolds','adoptionPolicy','historicalEvidenceSheetNames']:assert m[k]==am[k],k
        assert len(m['originalDonorEvidence'])==58 and len(m['caseEvidence'])==73
        for n in ['Master_Donor_Concept_to_DIM_Crosswalk.csv','ISA_Correction_Review_07NOV2026.csv']:
            b=(D/n).read_bytes();assert b'\r\n' not in b and list(csv.reader(io.StringIO(b.decode())))==grid,n
        class Table(HTMLParser):
            def __init__(self):super().__init__(convert_charrefs=True);self.rows=[];self.row=[];self.cell=None
            def handle_starttag(self,tag,attrs):
                if tag=='tr':self.row=[]
                if tag=='td':self.cell=''
            def handle_data(self,data):
                if self.cell is not None:self.cell+=data
            def handle_endtag(self,tag):
                if tag=='td':self.row.append(self.cell);self.cell=None
                if tag=='tr' and self.row:self.rows.append(self.row)
        for n in ['Master_Donor_Concept_to_DIM_Crosswalk.md','ISA_Correction_Review_07NOV2026.md']:
            parser=Table();parser.feed((D/n).read_text());assert parser.rows==[row for i,row in enumerate(grid) if i>1 and i not in r['review_sections']],n
        assert s['currentBatch']==s['currentIteration']==p['checkpoint'] and s['currentBatchDeliveryStatus']=='COMPLETE'
        assert s['technicalIterationsCompleted']==32 and s['completedWorkPackages']==4
        forecast=s['remainingDeliveryForecast']
        assert (forecast['centralRemainingPrompts'],forecast['lowRemainingPrompts'],forecast['highRemainingPrompts'])==(9,7,11)
        assert forecast['lastCompletedSlot']==forecast['plannedQueueCompleted']==13
        nextblocks=[x['id'] for x in a['source_blocks'] if x['source']=='SDD']
        assert len(nextblocks)==27 and s['nextSourceBlocks']==nextblocks and s['nextSourceIDs']==[]
        assert s['nextOnOwnerProceed']==e['next_task']=='ISA-SOFTWARE-ARCHITECTURE'
        for k in ['propertyCatalogue','observableCatalogue','commandCatalogue','typeCatalogue']:assert s[k]==ast[k],k
        assert s['coverage']['semanticEntriesReviewedInCorrection']==480 and s['coverage']['sourceSupportedPrimaryEntries']==474
        assert s['coverage']['supportingDefinitionsRead']==ast['coverage']['supportingDefinitionsRead']==171
        assert s['servicesAndContext']['architectureReconciliationComplete'] is False
        assert m['counts']['informationRows']==320 and m['counts']['ISADerivedContributions']==289
        assert m['ISAEvidence']['currentPrimaryReviews']==480 and m['ISAEvidence']['sourceSupportedPrimary']==474
        assert m['ISAEvidence']['primaryTypeReviews']==224 and m['ISAEvidence']['servicesAndContext']==evidence_name
        assert s['workbookSnapshot']['informationRows']==253 and s['workbookSnapshot']['primaryReviewed']==226
        assert s['workbookSnapshot']['sha256']==a['publication']['workbook_snapshot']['sha256']
        assert not s['workbookSnapshot']['currentlyMatchesReadableView']
        for n in ['PITON_ISA_Coverage_Correction_07NOV2026.md','Master_Donor_Concept_to_DIM_Crosswalk.md']:
            for link in re.findall(r'\]\(([^)]+)\)',(D/n).read_text()):
                if '://' not in link and not link.startswith('#'):assert (D/link.split('#')[0]).is_file(),link
        print('PASS: 30 service/category definitions, 250 memberships over 226 preserved catalogue outcomes, 18 INTRO and 30 WHITE blocks, all source hashes; 480 primary outcomes and 320 master rows.')
        print('PASS: all 314 prior rows, six questions, 58 donor records, 73 case statements, ten evidence/workbook files, 450 prior catalogue entries and all other source blocks preserved; JSON/CSV/HTML parity.')
        print('PASS: delivery 13 complete; nine central deliveries remain, range 7–11; 27 SDD source blocks next, with no repeated catalogue entries or premature architecture closure.')
        if os.environ.get('APPLY_ISA_TEXT')=='1':subprocess.run(['git','add','--',*p['files']],check=True)
    else:
        baseline='2e7395c8f82e7c46e81a6978f27c8d29a21adb62'
        subprocess.run(['git','fetch','--no-tags','--depth=1','origin',baseline],check=True)
        source=subprocess.check_output(['git','show',baseline+':.github/workflows/publish-isa03d-checkpoint.yml']).decode()
        lines=source.split('  VERIFY_ISA_TEXT: |\n',1)[1].split('\njobs:\n',1)[0].splitlines()
        exec(compile('\n'.join(line[4:] for line in lines),'<existing master/ISA verifier>','exec'))
jobs:
  publish:
    name: Commit reviewed ISA checkpoint using existing assembler
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      checkpoint: ${{ steps.commit.outputs.checkpoint }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply exact reviewed artifacts and check preservation
        env:
          APPLY_ISA_TEXT: '1'
        run: python3 -c "$VERIFY_ISA_TEXT"
      - name: Commit authorized research artifacts only
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check -- . ':!Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/README.md'
          git -c core.whitespace=-blank-at-eol diff --cached --check -- Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/README.md
          python3 -c "from pathlib import Path; p=Path('Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/README.md'); assert all(not line[len(line.rstrip()):] or (line.endswith('  ') and len(line)-len(line.rstrip())==2 and bool(line.rstrip())) for line in p.read_text().splitlines()), 'Unexpected README whitespace'"
          if ! git diff --cached --quiet; then
            git commit -m 'research(dim-v2): publish verified current ISA checkpoint and recovery routing'
            git push origin HEAD:research/dim-profile-v2
          fi
          echo "checkpoint=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify-published:
    name: Read-only verification of exact published ISA checkpoint
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.checkpoint }}
          persist-credentials: false
      - name: Verify committed workbook or source checkpoint and prior preservation
        run: python3 -c "$VERIFY_ISA_TEXT"
      - name: Record checked commit
        run: echo 'Verified ISA checkpoint ${{ needs.publish.outputs.checkpoint }}'
