name: Publish and verify reviewed ISA checkpoint
on:
  push:
    branches: [research/dim-profile-v2]
    paths:
      - Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/.isa_review_text_update.txt
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isa-reviewed-text-publication
  cancel-in-progress: false
env:
  VERIFY_ISA_TEXT: |
    import os,sys,json,hashlib,base64,lzma,subprocess,csv,re
    from pathlib import Path
    D=Path('Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk')
    checksum,encoded=(D/'.isa_review_text_update.txt').read_text().strip().split('\n',1)
    encoded=''.join(encoded.split()).encode()
    assert hashlib.sha256(encoded).hexdigest()==checksum
    p=json.loads(lzma.decompress(base64.b64decode(encoded,validate=True)))
    if p['checkpoint']!='MASTER-ISA-INTEGRATION':
        baseline='da168cf68b6fb96c090daacf70d3c8efcf004b77'
        subprocess.run(['git','fetch','--no-tags','--depth=1','origin',baseline],check=True)
        prior_workflow=subprocess.check_output(['git','show',baseline+':.github/workflows/publish-isa03d-checkpoint.yml']).decode()
        lines=prior_workflow.split('  VERIFY_ISA_TEXT: |\n',1)[1].split('\njobs:\n',1)[0].splitlines()
        exec(compile('\n'.join(line[4:] for line in lines),'<existing ISA verifier>','exec'))
    else:
        sys.path.insert(0,'scripts')
        from publish_isa03a_checkpoint import assemble
        from publish_isa02_checkpoint import workbook
        sha=lambda b:hashlib.sha256(b).hexdigest()
        assert all(v['kind'] in {'text_delta','xlsx_export'} for v in p['files'].values()),'Unexpected artifact kind'
        assert all(Path(n).suffix in {'.md','.json','.csv','.xlsx'} for n in p['files']),'Unexpected output suffix'
        subprocess.run(['git','fetch','--no-tags','--depth=1','origin',p['base_commit']],check=True)
        old=lambda name:subprocess.check_output(['git','show',p['base_commit']+':'+str(D/name)])
        exact=all(Path(n).is_file() and sha(Path(n).read_bytes())==v['sha256'] for n,v in p['files'].items())
        if os.environ.get('APPLY_ISA_TEXT')=='1' and not exact:
            assemble(p)
        for n,v in p['files'].items():
            b=Path(n).read_bytes()
            assert sha(b)==v['sha256'] and len(b)==v['size'],n
        for n,digest in p['preserved_files'].items():
            assert sha(Path(n).read_bytes())==digest,'Historical snapshot changed: '+n
        r=json.loads((D/'ISA_Coverage_Register_07NOV2026.json').read_text())
        prior=json.loads(old('ISA_Coverage_Register_07NOV2026.json'))
        s=json.loads((D/'ISA_Correction_Status_07NOV2026.json').read_text())
        e=json.loads((D/s['currentEvidence']).read_text())
        expected=p['validation_summary']
        assert len(r['dms_entries'])==expected['source_inventory_entries']==480
        assert len(r['review_grid'])-len(r['review_sections'])-2==expected['information_rows']==253
        assert sum(x['semantic_review_status'].startswith('REVIEWED_') for x in r['dms_entries'])==expected['reviewed_total']==226
        assert sum(x['semantic_review_status']=='REVIEWED_SOURCE_SUPPORTED' for x in r['dms_entries'])==expected['supported_total']==220
        assert sum(bool(x.get('supporting_definition_checked_in')) for x in r['dms_entries'])==expected['unique_supporting_definitions']==167
        assert sum(x['semantic_review_status']=='REVIEWED_QUESTION_RECORDED' for x in r['dms_entries'])==len(r['specific_questions'])==expected['questions_total']==6
        assert s['nextOnOwnerProceed']==p['next_task']
        view=(D/s['currentReview']).read_text()
        assert '<table>' in view
        with (D/s['currentReview'].replace('.md','.csv')).open(newline='') as handle:
            assert list(csv.reader(handle))==r['review_grid']
        assert r==prior,'Scientific source register changed during integration'
        assert e==json.loads(old(s['currentEvidence'])),'Command evidence changed during integration'
        old_s=json.loads(old('ISA_Correction_Status_07NOV2026.json'))
        assert s['nextOnOwnerProceed']==old_s['nextOnOwnerProceed']=='ISA-TYPES-BASE-MESSAGES'
        assert s['nextSourceIDs']==old_s['nextSourceIDs'] and len(s['nextSourceIDs'])==54
        assert s['remainingDeliveryForecast']['centralRemainingPrompts']==15
        assert s['remainingDeliveryForecast']['plannedQueueCompleted']==7
        assert s['masterIntegration']['newSourceReviews']==0
        assert s['masterIntegration']['newDIMContentAdopted'] is False
        master=json.loads((D/'Master_Donor_Concept_to_DIM_Crosswalk.json').read_text())
        legacy=json.loads(old('Master_Donor_Concept_to_DIM_Crosswalk_v0.9_Step15_ISA_07NOV2026.json'))
        assert master['originalDonorEvidence']==legacy['originalDonorEvidence']
        assert master['caseEvidence']==legacy['caseEvidence']
        assert master['review_grid']==r['review_grid']
        assert len(master['rows'])==len({x['row_id'] for x in master['rows']})==253
        assert master['adoptionPolicy']['focused_adoption_checkpoint']==24
        assert master['adoptionPolicy']['consolidated_baseline_checkpoint']==40
        assert master['adoptionPolicy']['content_adopted_by_this_update'] is False
        assert s['currentWorkbook']=='Master_Donor_Concept_to_DIM_Crosswalk.xlsx'
        b=(D/s['currentWorkbook']).read_bytes()
        assert sha(b)==s['workbookSnapshot']['sha256']==master['currentWorkbookSha256']
        current=workbook(b)
        previous=workbook((D/p['baseline_workbook']).read_bytes())
        legacy_book=workbook((D/p['legacy_master']).read_bytes())
        assert len(current)==26 and 'Master Crosswalk' in current
        eq=lambda a,b:(a[0] or '',a[1] or '')==(b[0] or '',b[1] or '')
        for old_name,new_name in p['legacy_sheet_map'].items():
            for address,value in legacy_book[old_name].items():
                if value[0] is not None or value[1] is not None:
                    assert eq(current[new_name].get(address,(None,None)),value),('Prior donor audit changed',old_name,address)
        for sheet in ['DMS Inventory','Source Blocks','Row Coverage','Earlier Findings','Sources','Legend','Validation','ISA Evidence','Dependencies','Questions']:
            for address,value in previous[sheet].items():
                if value[0] is not None or value[1] is not None:
                    assert eq(current[sheet].get(address,(None,None)),value),('ISA evidence changed',sheet,address)
        for i,row in enumerate(r['review_grid'],6):
            for j,value in enumerate(row):
                assert (current['Master Crosswalk'].get(chr(65+j)+str(i),('',None))[0] or '')==str(value or ''),'Master grid mismatch'
        bylabel={x[-1]:x for x in r['review_grid'][2:] if x[-1]}
        for oldrow in legacy['rows']:
            if oldrow.get('type')!='section':
                row=bylabel[oldrow['dim']]
                assert row[:7]+row[8:]==oldrow['display'],'Earlier donor/case cells changed'
        assert not any(value[0] in {'#REF!','#DIV/0!','#VALUE!','#NAME?','#N/A','#NUM!','#SPILL!'} for cells in current.values() for value in cells.values())
        for address,wanted in {'A6':226,'D6':216,'G6':6,'G12':220,'G13':167,'G14':0}.items():
            assert float(current['Summary'][address][0])==wanted
        assert s['workbookSnapshot']['currentlyMatchesReadableView'] is True
        record=json.loads((D/p['publication_record']).read_text())
        assert record['new_semantic_source_reviews']==0 and record['DIM_content_adopted'] is False
        for path,digest in record['published_file_sha256'].items():
            assert sha(Path(path).read_bytes())==digest,'Master integration record hash mismatch'
        for name in ['README.md','PITON_ISA_Coverage_Correction_07NOV2026.md','PITON_Donor_Concept_to_DIM_Crosswalk_v0.1_05NOV2026.md','PLAN_ISA_Coverage_Correction_07NOV2026.md','PLAN_Donor_Concept_to_DIM_Master_Crosswalk_v0.1_05NOV2026.md',s['currentReview']]:
            text=(D/name).read_text()
            assert s['currentWorkbook'] in text
            for link in re.findall(r'\]\(([^)]+)\)',text):
                if '://' not in link and not link.startswith('#'):
                    assert (D/link.split('#',1)[0]).is_file(),'Broken current link: '+link
        print('PASS: master integrates all253 rows; all prior ISA, donor and case evidence preserved.')
        print('PASS: adoption checkpoints24/40 recorded; zero content adoption or new research; slot8 remains next.')
        if os.environ.get('APPLY_ISA_TEXT')=='1':
            subprocess.run(['git','add','--',*p['files'].keys()],check=True)
        print('CHECKPOINT:',p['checkpoint'],'NEXT:',p['next_task'])
jobs:
  publish:
    name: Commit reviewed ISA checkpoint using existing assembler
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      checkpoint: ${{ steps.commit.outputs.checkpoint }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply exact reviewed artifacts and check preservation
        env:
          APPLY_ISA_TEXT: '1'
        run: python3 -c "$VERIFY_ISA_TEXT"
      - name: Commit authorized research artifacts only
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'research(dim-v2): publish verified current ISA checkpoint and recovery routing'
            git push origin HEAD:research/dim-profile-v2
          fi
          echo "checkpoint=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify-published:
    name: Read-only verification of exact published ISA checkpoint
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.checkpoint }}
          persist-credentials: false
      - name: Verify committed workbook or source checkpoint and prior preservation
        run: python3 -c "$VERIFY_ISA_TEXT"
      - name: Record checked commit
        run: echo 'Verified ISA checkpoint ${{ needs.publish.outputs.checkpoint }}'
