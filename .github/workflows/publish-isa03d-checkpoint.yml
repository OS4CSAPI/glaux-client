name: Publish and verify reviewed ISA checkpoint
on:
  push:
    branches: [research/dim-profile-v2]
    paths:
      - Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/.isa_review_text_update.txt
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isa-reviewed-text-publication
  cancel-in-progress: false
env:
  VERIFY_ISA_TEXT: |
    import os,sys,json,hashlib,base64,lzma,subprocess,csv,re
    from pathlib import Path
    sys.path.insert(0,'scripts')
    from publish_isa03a_checkpoint import assemble
    from publish_isa02_checkpoint import workbook
    D=Path('Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk')
    checksum,encoded=(D/'.isa_review_text_update.txt').read_text().strip().split('\n',1)
    encoded=''.join(encoded.split()).encode()
    sha=lambda b:hashlib.sha256(b).hexdigest()
    assert sha(encoded)==checksum,'Reviewed checkpoint checksum differs'
    p=json.loads(lzma.decompress(base64.b64decode(encoded,validate=True)))
    publishing_workbook=p['checkpoint']=='ISA-PROPERTIES-PUBLISH'
    allowed={'text_delta','xlsx_export'} if publishing_workbook else {'text_delta'}
    assert all(v['kind'] in allowed for v in p['files'].values()),'Unexpected artifact kind'
    assert all(Path(n).suffix in ({'.md','.json','.csv','.xlsx'} if publishing_workbook else {'.md','.json','.csv'}) for n in p['files']),'Unexpected output suffix'
    subprocess.run(['git','fetch','--no-tags','--depth=1','origin',p['base_commit']],check=True)
    old=lambda name:subprocess.check_output(['git','show',p['base_commit']+':'+str(D/name)])
    already_exact=all(Path(n).is_file() and sha(Path(n).read_bytes())==v['sha256'] for n,v in p['files'].items())
    if os.environ.get('APPLY_ISA_TEXT')=='1' and not already_exact:
        assemble(p)
    for n,v in p['files'].items():
        b=Path(n).read_bytes()
        assert sha(b)==v['sha256'] and len(b)==v['size'],n
    for n,digest in p['preserved_files'].items():
        assert sha(Path(n).read_bytes())==digest,'Historical snapshot changed: '+n
    r=json.loads((D/'ISA_Coverage_Register_07NOV2026.json').read_text())
    prior=json.loads(old('ISA_Coverage_Register_07NOV2026.json'))
    s=json.loads((D/'ISA_Correction_Status_07NOV2026.json').read_text())
    e=json.loads((D/s['currentEvidence']).read_text())
    expected=p['validation_summary']
    assert len(r['dms_entries'])==len(prior['dms_entries'])==expected['source_inventory_entries']
    for key in ['sources','source_blocks','row_targets','legacy_records','baseline','census_method','reconciliation','legend']:
        assert r[key]==prior[key],'Unrelated source records changed: '+key
    assert len(r['review_grid'])-len(r['review_sections'])-2==expected['information_rows']
    assert sum(x['semantic_review_status'].startswith('REVIEWED_') for x in r['dms_entries'])==expected['reviewed_total']
    assert sum(x['semantic_review_status']=='REVIEWED_SOURCE_SUPPORTED' for x in r['dms_entries'])==expected['supported_total']
    assert sum(bool(x.get('supporting_definition_checked_in')) for x in r['dms_entries'])==expected['unique_supporting_definitions']
    assert sum(x['semantic_review_status']=='REVIEWED_QUESTION_RECORDED' for x in r['dms_entries'])==len(r['specific_questions'])==expected['questions_total']
    assert s['nextOnOwnerProceed']==p['next_task']
    view=(D/s['currentReview']).read_text()
    assert '<table>' in view
    with (D/s['currentReview'].replace('.md','.csv')).open(newline='') as handle:
        assert list(csv.reader(handle))==r['review_grid']
    props=[x for x in r['dms_entries'] if x['source_kind']=='property']
    if publishing_workbook:
        # Publication-only: exact saved scientific records and table, not another review.
        for key in ['dms_entries','specific_questions','review_grid','review_sections','candidate_rows']:
            assert r[key]==prior[key],'Saved scientific content changed: '+key
        earlier_e=json.loads(old(s['currentEvidence']))
        for key in ['primary_records','supporting_definitions','specific_questions','source_inspection','case_checks','source_inspections_by_pass']:
            assert e[key]==earlier_e[key],'Saved evidence changed: '+key
        assert len(props)==91 and all(x['semantic_review_status'].startswith('REVIEWED_') for x in props)
        assert s['propertyCatalogue']['remaining']==0 and s['propertyCatalogue']['workbookPublicationState']=='COMPLETE'
        assert s['workbookSnapshot']['currentlyMatchesReadableView'] is True
        assert s['currentWorkbook']=='ISA_Correction_Review_Properties_07NOV2026.xlsx'
        assert s['nextOnOwnerProceed']=='ISA-04-ATMOSPHERIC'
        next_ids=set(s['nextSourceIDs'])
        assert next_ids=={'ISA-DMS-'+str(i) for i in range(123,131)}
        assert all(x['semantic_review_status']=='NOT_REVIEWED_IN_CORRECTION' for x in r['dms_entries'] if x['id'] in next_ids)
        b=(D/s['currentWorkbook']).read_bytes()
        assert sha(b)==s['workbookSnapshot']['sha256']
        current=workbook(b)
        previous=workbook((D/'ISA_Correction_Review_ISA03D_07NOV2026.xlsx').read_bytes())
        assert list(current)==list(previous) and len(current)==12
        for sheet in ['Source Blocks','Earlier Findings','Sources','Legend']:
            assert current[sheet]==previous[sheet],'Preserved sheet changed: '+sheet
        for sheet in ['Row Coverage','ISA Evidence','Dependencies','Questions']:
            for address,value in previous[sheet].items():
                if address not in {'A1','A2'}:
                    assert current[sheet].get(address)==value,(sheet,address)
        for i,row in enumerate(r['review_grid'],6):
            for j,value in enumerate(row):
                assert (current['ISA Review'].get(chr(65+j)+str(i),('',None))[0] or '')==str(value or ''),'Workbook/table mismatch'
        expected_evidence=[]
        for x in e['primary_records']:
            expected_evidence.append([x['id'],x['entry_id'],x['native_term'],x['native_type']+' / '+x['native_structure'],x['source_standing'],x['target_row'],x['proposed_label'],x['mapping_relation'],x['disposition'],x['original_meaning'],x['mapping_boundary'],x['source_locator'],'; '.join(x['dependency_terms']),x.get('question_id') or ''])
        assert len(expected_evidence)==26
        for i,row in enumerate(expected_evidence,71):
            for j,value in enumerate(row):
                assert (current['ISA Evidence'].get(chr(65+j)+str(i),('',None))[0] or '')==str(value or ''),'Integrated evidence mismatch'
        evidence_ids=[current['ISA Evidence']['B'+str(i)][0] for i in range(5,97)]
        assert len(evidence_ids)==len(set(evidence_ids))==92
        assert {x['id'] for x in props}.issubset(set(evidence_ids))
        dependency_ids=[current['Dependencies']['A'+str(i)][0] for i in range(5,67)]
        assert len(dependency_ids)==len(set(dependency_ids))==62
        assert set(dependency_ids)=={x['id'] for x in r['dms_entries'] if x.get('supporting_definition_checked_in')}
        for i,q in enumerate(r['specific_questions'],5):
            vals=[q['id'],q['native_term'],q['known'],q['question'],q['decision'],q['evidence'],q['next_resolution'],q['state']]
            for j,value in enumerate(vals):
                assert current['Questions'][chr(65+j)+str(i)][0]==value,'Question meaning changed'
        for address,wanted in {'A6':91,'D6':83,'G6':4,'G10':87,'G11':4,'G12':1,'G13':1,'G14':0}.items():
            assert abs(float(current['Summary'][address][0])-wanted)<1e-10,('Summary',address)
        assert float(current['Validation']['B18'][0])==42 and float(current['Validation']['B19'][0])==0
        assert current['Validation']['B20'][0]=='79 / 12'
        assert all(value[0] not in {'#REF!','#DIV/0!','#VALUE!','#NAME?','#N/A','#NUM!','#SPILL!'} for cells in current.values() for value in cells.values())
        report=json.loads((D/'ISA_Properties_Publication_Record_07NOV2026.json').read_text())
        assert report['new_semantic_source_reviews']==0 and report['observables_reviewed_here']==0
        for name,digest in report['published_file_sha256'].items():
            assert sha(Path(name).read_bytes())==digest,'Publication-record hash mismatch: '+name
        for name in ['PITON_ISA_Coverage_Correction_07NOV2026.md','PLAN_ISA_Coverage_Correction_07NOV2026.md',s['currentReview']]:
            text=(D/name).read_text()
            assert s['currentWorkbook'] in text
            for link in re.findall(r'\]\(([^)]+)\)',text):
                if '://' not in link and not link.startswith('#'):
                    assert (D/link.split('#',1)[0]).is_file(),'Broken local link: '+link
        print('PASS: consolidated twelve-sheet workbook contains all91 saved property outcomes,87 supported and four exact questions;118 information rows.')
        print('PASS: all26 saved additions integrated;62 unique supporting definitions; correct formulas and source/grid/evidence agreement.')
        print('PASS: earlier evidence, non-ISA values, historical workbook and source states preserved; zero new reviews; atmospheric observables remain unreviewed.')
    else:
        records=[x for x in e['primary_records'] if x['review_pass']==p['checkpoint']]
        target={x['entry_id'] for x in records}
        assert len(records)==len(target)==expected['assigned']==expected['reviewed']
        oldentries={x['id']:x for x in prior['dms_entries']}
        changed={x['id'] for x in r['dms_entries'] if x['semantic_review_status']!=oldentries[x['id']]['semantic_review_status']}
        assert changed==target,'Unexpected primary review scope'
        priorq=prior['specific_questions'];currentq=r['specific_questions']
        assert currentq[:len(priorq)]==priorq
        addedq=currentq[len(priorq):]
        assert {q['id'] for q in addedq}==set(expected.get('new_question_ids',[]))
        assert len({q['id'] for q in currentq})==len(currentq)
        assert all(q['entry_id'] in target for q in addedq)
        assert {x['question_id'] for x in records if x.get('question_id')}=={q['id'] for q in addedq}
        assert all(q in e.get('specific_questions',[]) for q in addedq)
        labels={x['proposed_label'] for x in records}
        assert len(labels)==len(records)
        assert [row for row in r['review_grid'] if row[-1] not in labels]==prior['review_grid']
        assert r['candidate_rows'][:len(prior['candidate_rows'])]==prior['candidate_rows']
        assert s['workbookSnapshot']['currentlyMatchesReadableView'] is False
        assert all(x['native_term'] in view for x in records) and 'snapshot' in view.lower() and 'newer' in view.lower()
        print('PASS: reviewed source group, exact text outputs, prior records/questions and workbook snapshot preserved.')
    if os.environ.get('APPLY_ISA_TEXT')=='1':
        subprocess.run(['git','add','--',*p['files'].keys()],check=True)
    print('CHECKPOINT:',p['checkpoint'],'NEXT:',p['next_task'])
jobs:
  publish:
    name: Commit reviewed ISA checkpoint using existing assembler
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      checkpoint: ${{ steps.commit.outputs.checkpoint }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply exact reviewed artifacts and check preservation
        env:
          APPLY_ISA_TEXT: '1'
        run: python3 -c "$VERIFY_ISA_TEXT"
      - name: Commit authorized research artifacts only
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'research(dim-v2): publish verified current ISA checkpoint and recovery routing'
            git push origin HEAD:research/dim-profile-v2
          fi
          echo "checkpoint=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify-published:
    name: Read-only verification of exact published ISA checkpoint
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.checkpoint }}
          persist-credentials: false
      - name: Verify committed workbook or source checkpoint and prior preservation
        run: python3 -c "$VERIFY_ISA_TEXT"
      - name: Record checked commit
        run: echo 'Verified ISA checkpoint ${{ needs.publish.outputs.checkpoint }}'
