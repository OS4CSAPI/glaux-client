name: Build Smart Citizen paper

on:
  push:
    branches:
      - work/details-view-20261023
    paths:
      - Docs/Research/Studies/Smart_Citizen/MANUSCRIPT.md
      - Docs/Research/Studies/Smart_Citizen/REFERENCES.json
      - Docs/Research/Studies/Smart_Citizen/figures/**
      - scripts/build-smart-citizen-paper.py
      - .github/workflows/smart-citizen-paper.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-paper:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/details-view-20261023
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install paper build dependencies
        run: |
          python -m pip install --disable-pip-version-check python-docx
          mkdir -p /tmp/glaux-paper-node
          cd /tmp/glaux-paper-node
          npm init -y >/dev/null 2>&1
          npm install sharp@0.34.4 >/dev/null
      - name: Build and verify paper
        env:
          CODEX_PRIMARY_RUNTIME_NODE: /opt/hostedtoolcache/node/24.0.0/x64/bin/node
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: /tmp/glaux-paper-node/node_modules
        run: |
          export CODEX_PRIMARY_RUNTIME_NODE="$(command -v node)"
          python scripts/build-smart-citizen-paper.py --version 0.5 --date 2026-10-24
          python scripts/verify-smart-citizen-paper.py --refresh
          python scripts/verify-smart-citizen-paper.py
      - name: Commit generated edition and refreshed manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Docs/Research/Studies/Smart_Citizen/SMART_CITIZEN_EXPERIMENT_PAPER.docx Docs/Research/Studies/Smart_Citizen/MANUSCRIPT_MANIFEST.json
          if git diff --cached --quiet; then
            echo "Generated paper already current."
            exit 0
          fi
          git commit -m "docs: regenerate Smart Citizen paper v0.5"
          git push origin HEAD:work/details-view-20261023
