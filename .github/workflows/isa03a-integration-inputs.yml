name: Export exact ISA review inputs
on:
  push:
    branches: [research/dim-profile-v2]
    paths: [.github/workflows/isa03a-integration-inputs.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record input identities
        run: |
          git rev-parse HEAD > ISA_INPUT_COMMIT.txt
          sha256sum Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/ISA_Correction_Review_ISA03D_07NOV2026.xlsx > ISA_WORKBOOK_SNAPSHOT_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: isa-review-text-inputs
          retention-days: 3
          path: |
            ISA_INPUT_COMMIT.txt
            ISA_WORKBOOK_SNAPSHOT_SHA256.txt
            Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/ISA*.json
            Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/ISA*.md
            Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/ISA*.csv
            Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/PLAN_ISA_Coverage_Correction_07NOV2026.md
            Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/PITON_ISA_Coverage_Correction_07NOV2026.md
            scripts/publish_isa03a_checkpoint.py
            scripts/publish_isa02_checkpoint.py
          if-no-files-found: error
# Current input export: sensing settings and measurement characteristics; text-only review.
