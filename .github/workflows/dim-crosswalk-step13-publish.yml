name: DIM V2 Step13 — publish W3C 2017 crosswalk workbook

on:
  push:
    branches:
      - research/dim-profile-v2
    paths:
      - "Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/Master_Donor_Concept_to_DIM_Crosswalk_v0.7_Step13_W3C_SOSA_SSN_06NOV2026.json"
      - "Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/Step13_W3C_SOSA_SSN_2017_Original_Vocabulary_Audit_06NOV2026.json"
      - "scripts/build_dim_crosswalk_step13.py"
      - "scripts/check_dim_crosswalk_step13.py"
      - ".github/workflows/dim-crosswalk-step13-publish.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dim-v2-step13-source-publisher
  cancel-in-progress: false
jobs:
  build-verify-commit:
    name: Build, validate and publish exact Step13 XLSX bytes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dim-profile-v2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construct new v0.7 Excel from current frozen v0.6 package
        run: python scripts/build_dim_crosswalk_step13.py
      - name: Independently check all source records and ZIP/XML/worksheet parity
        run: python scripts/check_dim_crosswalk_step13.py
      - name: Commit the authenticated, versioned XLSX to the research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/Master_Donor_Concept_to_DIM_Crosswalk_v0.7_Step13_W3C_SOSA_SSN_06NOV2026.xlsx
          if git diff --cached --quiet; then
            echo "Step13 workbook already matches GitHub"
          else
            git commit -m "research(dim-v2): publish W3C 2017 source-checked v0.7 Excel master"
            git push origin HEAD:research/dim-profile-v2
          fi
