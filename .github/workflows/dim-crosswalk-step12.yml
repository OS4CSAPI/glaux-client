name: DIM V2 Step12 — validate OMS 3.0 source-checked crosswalk
on:
  push:
    branches:
      - research/dim-profile-v2
    paths:
      - "Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/Master_Donor_Concept_to_DIM_Crosswalk_v0.6_Step12_OMS_06NOV2026.*"
      - "Docs/Research/DIM_Profile_V2/Donor_DIM_Crosswalk/Step12_OMS_3_Original_Clause_Audit_06NOV2026.json"
      - "scripts/check_dim_crosswalk_step12.py"
      - ".github/workflows/dim-crosswalk-step12.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-source-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check actual ZIP/XML, source terminology and donor/case parity
        run: python scripts/check_dim_crosswalk_step12.py
