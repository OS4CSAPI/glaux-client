<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">Glaux experimental client architecture</title>
  <desc id="desc">The same captured Connected Systems response supports competent standard inspection and bounded MPSS interpretation before operator presentation.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#333"/></marker></defs>
  <style>
    text{font-family:Arial,Liberation Sans,sans-serif;fill:#111}.title{font-size:32px;font-weight:700}.head{font-size:24px;font-weight:700}.body{font-size:21px}.note{font-size:20px;font-style:italic}.box{fill:#f5f5f5;stroke:#555;stroke-width:2}.boundary{fill:#fff;stroke:#222;stroke-width:3}.edge{fill:none;stroke:#333;stroke-width:2.5;marker-end:url(#arrow)}.dashed{stroke-dasharray:9 7}
  </style>
  <rect x="0" y="0" width="1200" height="980" fill="#fff"/>
  <text class="title" x="600" y="45" text-anchor="middle">Glaux experimental client architecture</text>
  <rect class="box" x="390" y="85" width="420" height="105" rx="6"/>
  <text class="head" x="600" y="125" text-anchor="middle">52°North CSAPI response</text>
  <text class="body" x="600" y="160" text-anchor="middle">Server-hosted standards representation</text>
  <rect class="boundary" x="95" y="245" width="1010" height="590" rx="8"/>
  <text class="head" x="600" y="282" text-anchor="middle">OS4CSAPI / glaux-client</text>
  <rect class="box" x="335" y="315" width="530" height="130" rx="6"/>
  <text class="head" x="600" y="353" text-anchor="middle">src/data</text>
  <text class="body" x="600" y="387" text-anchor="middle">HTTP retrieval · original response capture</text>
  <text class="body" x="600" y="417" text-anchor="middle">Pinned ogc-client CSAPI parsing</text>
  <text class="body" x="600" y="442" text-anchor="middle">Generic extraction</text>
  <rect class="box" x="125" y="530" width="365" height="125" rx="6"/>
  <text class="head" x="307" y="568" text-anchor="middle">Standard View</text>
  <text class="body" x="307" y="603" text-anchor="middle">Competent generic inspection</text>
  <text class="body" x="307" y="633" text-anchor="middle">Unknown content remains visible</text>
  <rect class="box" x="710" y="505" width="365" height="150" rx="6"/>
  <text class="head" x="892" y="543" text-anchor="middle">src/profile</text>
  <text class="body" x="892" y="578" text-anchor="middle">Bounded DIM / MPSS interpretation</text>
  <text class="body" x="892" y="608" text-anchor="middle">Definitions · subjects · units</text>
  <text class="body" x="892" y="638" text-anchor="middle">Relationships · explicit uncertainty</text>
  <rect class="box" x="710" y="715" width="365" height="100" rx="6"/>
  <text class="head" x="892" y="753" text-anchor="middle">src/presentation</text>
  <text class="body" x="892" y="787" text-anchor="middle">Operator View / Resource Details</text>
  <rect class="box" x="125" y="715" width="365" height="100" rx="6"/>
  <text class="head" x="307" y="753" text-anchor="middle">Evidence inspection</text>
  <text class="body" x="307" y="787" text-anchor="middle">Raw body · source paths · warnings</text>
  <path class="edge" d="M600 190 V315"/>
  <path class="edge" d="M510 445 V485 H307 V530"/>
  <path class="edge" d="M690 445 V485 H892 V505"/>
  <path class="edge" d="M892 655 V715"/>
  <path class="edge" d="M307 655 V715"/>
  <rect class="box" x="355" y="865" width="490" height="80" rx="6"/>
  <text class="head" x="600" y="899" text-anchor="middle">Experiment comparison</text>
  <text class="body" x="600" y="932" text-anchor="middle">Same evidence · generic vs profile-aware behavior</text>
  <path class="edge dashed" d="M307 815 V905 H355"/>
  <path class="edge dashed" d="M892 815 V905 H845"/>
  <text class="note" x="600" y="973" text-anchor="middle">Smart Citizen connected-resource traversal is planned; it is not current deployed behavior.</text>
</svg>
