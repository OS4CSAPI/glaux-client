<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
<title id="title">Proposed experiment architecture</title>
<desc id="desc">Proposed study design. Boxes and arrows describe intended roles and relationships, not an implemented service or verified physical installation.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#333"/></marker></defs>
<style>text{font-family:Arial,Liberation Sans,sans-serif;fill:#111}.title{font-size:32px;font-weight:700}.head{font-size:25px;font-weight:700}.body{font-size:24px}.label{font-size:23px}.note{font-size:23px;font-style:italic}.box{fill:#f5f5f5;stroke:#555;stroke-width:2}.edge{fill:none;stroke:#333;stroke-width:2.5;marker-end:url(#arrow)}.uncertain{stroke-dasharray:9 7}</style>
<rect x="0" y="0" width="1200" height="100%" fill="#fff"/>
<text class="title" x="600" y="44" text-anchor="middle">Proposed experiment architecture</text>
<rect class="box" x="60" y="90" width="320" height="135" rx="5"/>
<text class="head" x="220" y="125" text-anchor="middle">Smart Citizen API</text>
<text class="body" x="220" y="162" text-anchor="middle">Resource metadata</text>
<text class="body" x="220" y="192" text-anchor="middle">and observations</text>
<rect class="box" x="440" y="90" width="320" height="135" rx="5"/>
<text class="head" x="600" y="125" text-anchor="middle">Published definitions</text>
<text class="body" x="600" y="162" text-anchor="middle">API and hardware</text>
<text class="body" x="600" y="192" text-anchor="middle">documentation</text>
<rect class="box" x="820" y="90" width="320" height="135" rx="5"/>
<text class="head" x="980" y="125" text-anchor="middle">Target definitions</text>
<text class="body" x="980" y="162" text-anchor="middle">OGC representations</text>
<text class="body" x="980" y="192" text-anchor="middle">and MPSS bindings</text>
<rect class="box" x="60" y="310" width="320" height="135" rx="5"/>
<text class="head" x="220" y="345" text-anchor="middle">Captured evidence</text>
<text class="body" x="220" y="382" text-anchor="middle">Reviewed source data</text>
<text class="body" x="220" y="412" text-anchor="middle">and acquisition record</text>
<rect class="box" x="440" y="310" width="320" height="135" rx="5"/>
<text class="head" x="600" y="345" text-anchor="middle">Adapter and mapping</text>
<text class="body" x="600" y="382" text-anchor="middle">Explicit transformations</text>
<text class="body" x="600" y="412" text-anchor="middle">and unresolved fields</text>
<rect class="box" x="820" y="310" width="320" height="135" rx="5"/>
<text class="head" x="980" y="345" text-anchor="middle">Mapping record</text>
<text class="body" x="980" y="382" text-anchor="middle">Source to target trace</text>
<text class="body" x="980" y="412" text-anchor="middle">and versioned decisions</text>
<rect class="box" x="440" y="525" width="320" height="120" rx="5"/>
<text class="head" x="600" y="560" text-anchor="middle">CSAPI test service</text>
<text class="body" x="600" y="597" text-anchor="middle">Descriptions and data</text>
<rect class="box" x="60" y="740" width="320" height="120" rx="5"/>
<text class="head" x="220" y="775" text-anchor="middle">Vendor interface</text>
<text class="body" x="220" y="812" text-anchor="middle">Source presentation</text>
<rect class="box" x="440" y="740" width="320" height="120" rx="5"/>
<text class="head" x="600" y="775" text-anchor="middle">Generic reader</text>
<text class="body" x="600" y="812" text-anchor="middle">Competent standard view</text>
<rect class="box" x="820" y="740" width="320" height="120" rx="5"/>
<text class="head" x="980" y="775" text-anchor="middle">Profile aware view</text>
<text class="body" x="980" y="812" text-anchor="middle">Bounded interpretation</text>
<rect class="box" x="310" y="915" width="580" height="70" rx="5"/>
<text class="head" x="600" y="950" text-anchor="middle">Paired evidence and evaluation</text>
