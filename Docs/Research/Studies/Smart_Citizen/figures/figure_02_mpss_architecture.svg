<rect class="note" x="930" y="104" width="230" height="220" rx="7"/>
<text class="head" x="1045" y="136" text-anchor="middle">Not implied</text>
<text class="body" x="952" y="172">• eight new APIs</text>
<text class="body" x="952" y="204">• eight required UI tabs</text>
<text class="body" x="952" y="236">• identical content on</text>
<text class="body" x="970" y="260">every device</text>
<text class="body" x="952" y="292">• wholesale donor-standard</text>
<text class="body" x="970" y="316">implementation</text>

<rect class="accent" x="350" y="420" width="540" height="125" rx="10"/>
<text class="head" x="620" y="454" text-anchor="middle">MPSS application profile + OGC binding</text>
<text class="body" x="620" y="486" text-anchor="middle">Purpose-specific scope and obligations · R01–R20 · reusable group contracts</text>
<text class="body" x="620" y="518" text-anchor="middle">Use native OGC mechanisms first; identify MERLIN-authored additions explicitly.</text>
