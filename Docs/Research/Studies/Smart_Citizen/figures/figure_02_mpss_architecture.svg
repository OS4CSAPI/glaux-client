<text class="head" x="620" y="116" text-anchor="middle">Domain information model</text>
<text class="body" x="620" y="145" text-anchor="middle">What things and relationships matter for a sensing system in employment?</text>
<rect class="inner" x="378" y="170" width="235" height="70" rx="5"/>
<text class="small" x="495" y="196" text-anchor="middle">Identity, model &amp;</text><text class="small" x="495" y="220" text-anchor="middle">technical description</text>
<rect class="inner" x="628" y="170" width="235" height="70" rx="5"/>
<text class="small" x="745" y="196" text-anchor="middle">Equipment &amp; physical</text><text class="small" x="745" y="220" text-anchor="middle">arrangement</text>
<rect class="inner" x="378" y="250" width="235" height="50" rx="5"/>
<text class="small" x="495" y="280" text-anchor="middle">Capabilities &amp; products</text>
<rect class="inner" x="628" y="250" width="235" height="50" rx="5"/>
<text class="small" x="745" y="280" text-anchor="middle">Deployment &amp; responsibility</text>
<rect class="inner" x="378" y="310" width="235" height="50" rx="5"/>
