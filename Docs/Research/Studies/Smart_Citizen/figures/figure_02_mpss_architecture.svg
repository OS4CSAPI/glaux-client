<text class="body" x="62" y="228">Hardware &amp; network models</text>
<text class="body" x="62" y="260">Lifecycle &amp; power models</text>
<text class="body" x="62" y="292">Sensing-family precedents</text>
<text class="small" x="62" y="322">Reuse is bounded by concept and evidence.</text>

