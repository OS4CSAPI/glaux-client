<text class="head" x="300" y="762" text-anchor="middle">Generic standards client</text>
<text class="small" x="300" y="790" text-anchor="middle">Reads base resources, links, typed values and definitions</text>

<rect class="accent" x="725" y="730" width="350" height="82" rx="8"/>
<text class="head" x="900" y="762" text-anchor="middle">MPSS-aware client</text>
<text class="small" x="900" y="790" text-anchor="middle">Assembles recognized domain meaning for operator use</text>

