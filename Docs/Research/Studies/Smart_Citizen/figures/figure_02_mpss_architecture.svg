<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
<title id="title">MERLIN domain information model and MPSS profile architecture</title>
<desc id="desc">Research and donor evidence inform a domain model organized around eight whole-system information subjects. The MPSS application profile and OGC binding connect that domain meaning to Connected Systems, SensorML and SWE Common representations, which remain available to generic clients and can be interpreted more richly by profile-aware clients.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#333"/></marker>
</defs>
<style>
  text{font-family:Arial,Liberation Sans,sans-serif;fill:#111}
  .title{font-size:30px;font-weight:700}
  .head{font-size:22px;font-weight:700}
  .body{font-size:18px}
  .small{font-size:16px}
  .box{fill:#f7f7f7;stroke:#555;stroke-width:2}
  .accent{fill:#eef3f7;stroke:#3f596d;stroke-width:2.2}
  .inner{fill:#fff;stroke:#777;stroke-width:1.4}
  .edge{fill:none;stroke:#333;stroke-width:2.5;marker-end:url(#arrow)}
  .note{fill:#fbfbfb;stroke:#888;stroke-width:1.5;stroke-dasharray:6 5}
</style>
<rect width="1200" height="860" fill="#fff"/>
<text class="title" x="600" y="42" text-anchor="middle">MERLIN domain model → MPSS profile → OGC representations → clients</text>

