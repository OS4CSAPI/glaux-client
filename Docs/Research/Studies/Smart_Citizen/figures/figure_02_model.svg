<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="990" viewBox="0 0 1200 990" role="img" aria-labelledby="title desc">
<title id="title">Proposed distinctions among represented subjects</title>
<desc id="desc">Proposed study design. Boxes and arrows describe intended roles and relationships, not an implemented service or verified physical installation.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#333"/></marker></defs>
<style>text{font-family:Arial,Liberation Sans,sans-serif;fill:#111}.title{font-size:32px;font-weight:700}.head{font-size:25px;font-weight:700}.body{font-size:24px}.label{font-size:23px}.note{font-size:23px;font-style:italic}.box{fill:#f5f5f5;stroke:#555;stroke-width:2}.edge{fill:none;stroke:#333;stroke-width:2.5;marker-end:url(#arrow)}.uncertain{stroke-dasharray:9 7}</style>
<rect x="0" y="0" width="1200" height="100%" fill="#fff"/>
<text class="title" x="600" y="44" text-anchor="middle">Proposed distinctions among represented subjects</text>
<rect class="box" x="60" y="100" width="340" height="135" rx="5"/>
<text class="head" x="230" y="135" text-anchor="middle">Model description</text>
<text class="body" x="230" y="172" text-anchor="middle">Reusable capabilities</text>
<text class="body" x="230" y="202" text-anchor="middle">and technical description</text>
<rect class="box" x="800" y="100" width="340" height="135" rx="5"/>
<text class="head" x="970" y="135" text-anchor="middle">Source registration</text>
<text class="body" x="970" y="172" text-anchor="middle">Platform record identifiers</text>
<text class="body" x="970" y="202" text-anchor="middle">and reported metadata</text>
<rect class="box uncertain" x="430" y="320" width="340" height="135" rx="5"/>
<text class="head" x="600" y="355" text-anchor="middle">Represented system</text>
<text class="body" x="600" y="392" text-anchor="middle">Physical identity policy</text>
<text class="body" x="600" y="422" text-anchor="middle">must be explicit</text>
<rect class="box" x="800" y="320" width="340" height="135" rx="5"/>
<text class="head" x="970" y="355" text-anchor="middle">Adapter provenance</text>
<text class="body" x="970" y="392" text-anchor="middle">Representation source</text>
<text class="body" x="970" y="422" text-anchor="middle">and mapping revision</text>
<rect class="box" x="60" y="580" width="340" height="135" rx="5"/>
<text class="head" x="230" y="615" text-anchor="middle">Data stream</text>
<text class="body" x="230" y="652" text-anchor="middle">Output and result schema</text>
<text class="body" x="230" y="682" text-anchor="middle">with qualified context</text>
<rect class="box" x="430" y="580" width="340" height="135" rx="5"/>
<text class="head" x="600" y="615" text-anchor="middle">Observation</text>
<text class="body" x="600" y="652" text-anchor="middle">Value and time</text>
<text class="body" x="600" y="682" text-anchor="middle">with source provenance</text>
<rect class="box uncertain" x="800" y="580" width="340" height="135" rx="5"/>
<text class="head" x="970" y="615" text-anchor="middle">Observed subject</text>
<text class="body" x="970" y="652" text-anchor="middle">Environment or equipment</text>
<text class="body" x="970" y="682" text-anchor="middle">as supported by evidence</text>
<path class="edge" d="M230 235 V387 H430"/>
<text class="label" x="124" y="292" text-anchor="middle">model applies</text>
<path class="edge uncertain" d="M970 235 V275 H600 V320"/>
<text class="label" x="775" y="266" text-anchor="middle">source representation</text>
<path class="edge" d="M800 387 H770"/>
<path class="edge" d="M430 420 H230 V580"/>
<text class="label" x="310" y="523" text-anchor="middle">produces</text>
<path class="edge" d="M400 647 H430"/>
<path class="edge" d="M770 647 H800"/>
<text class="label" x="600" y="552" text-anchor="middle">Stream supplies records</text>
<text class="label" x="970" y="552" text-anchor="middle">Record is about a subject</text>
<path d="M80 790 H1120" stroke="#aaa" stroke-width="1.5"/>
<text class="head" x="600" y="837" text-anchor="middle">Power information retains its limits</text>
<text class="body" x="600" y="880" text-anchor="middle">Battery percentage does not identify a physical battery</text>
<text class="body" x="600" y="913" text-anchor="middle">or establish a directed supply relationship.</text>
<text class="note" x="600" y="965" text-anchor="middle">Dashed elements require an explicit identification or subject decision.</text>
</svg>
