<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Experimental CSAPI server lineage and study role</title>
<desc id="desc">Factual upstream and deployment lineage is shown with solid arrows; the proposed Smart Citizen adapter and Glaux use are shown with dashed arrows.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#333"/></marker></defs>
<style>text{font-family:Arial,Liberation Sans,sans-serif;fill:#111}.title{font-size:31px;font-weight:700}.head{font-size:24px;font-weight:700}.body{font-size:21px}.note{font-size:20px;font-style:italic}.box{fill:#f7f7f7;stroke:#555;stroke-width:2}.edge{fill:none;stroke:#333;stroke-width:2.5;marker-end:url(#arrow)}.proposed{stroke-dasharray:10 7}</style>
<rect width="1200" height="900" fill="#fff"/>
<text class="title" x="600" y="42" text-anchor="middle">Experimental CSAPI server lineage and study role</text>
<rect class="box" x="90" y="95" width="440" height="125" rx="6"/>
<text class="head" x="310" y="130" text-anchor="middle">pygeoapi project</text>
<text class="body" x="310" y="168" text-anchor="middle">Python OGC API server framework</text>
<text class="body" x="310" y="198" text-anchor="middle">GeoPython · MIT licensed</text>
<rect class="box" x="90" y="285" width="440" height="145" rx="6"/>
<text class="head" x="310" y="320" text-anchor="middle">52°North connected-systems-pygeoapi</text>
<text class="body" x="310" y="358" text-anchor="middle">Connected Systems proof of concept</text>
<text class="body" x="310" y="388" text-anchor="middle">tested upstream commit 6ad75aa7…</text>
<text class="body" x="310" y="418" text-anchor="middle">Apache-2.0</text>
<rect class="box" x="90" y="510" width="440" height="180" rx="6"/>
<text class="head" x="310" y="545" text-anchor="middle">OS4CSAPI Oracle deployment</text>
<text class="body" x="310" y="583" text-anchor="middle">/csapi-pygeoapi</text>
<text class="body" x="310" y="613" text-anchor="middle">image sha256:15e6991a…</text>
<text class="body" x="310" y="643" text-anchor="middle">public-URL + bootstrap-ID patches</text>
<text class="body" x="310" y="673" text-anchor="middle">64-bit architecture / native-dependency adaptations</text>
<path class="edge" d="M310 220 V285"/>
<path class="edge" d="M310 430 V510"/>
<rect class="box" x="700" y="115" width="400" height="120" rx="6"/>
<text class="head" x="900" y="150" text-anchor="middle">52°North public demo</text>
<text class="body" x="900" y="188" text-anchor="middle">csa.demo.52north.org</text>
<text class="note" x="900" y="220" text-anchor="middle">separate deployment, not study target</text>
<rect class="box" x="700" y="510" width="400" height="105" rx="6"/>
<text class="head" x="900" y="545" text-anchor="middle">Smart Citizen adapter</text>
<text class="body" x="900" y="583" text-anchor="middle">proposed source → CSAPI mapping</text>
<rect class="box" x="700" y="690" width="400" height="105" rx="6"/>
<text class="head" x="900" y="725" text-anchor="middle">Glaux client</text>
<text class="body" x="900" y="763" text-anchor="middle">proposed retrieval and evaluation</text>
<path class="edge proposed" d="M700 562 H530"/>
<path class="edge proposed" d="M530 640 H650 V742 H700"/>
<text class="note" x="600" y="850" text-anchor="middle">Solid arrows: implemented lineage. Dashed arrows: proposed experiment path.</text>
</svg>
