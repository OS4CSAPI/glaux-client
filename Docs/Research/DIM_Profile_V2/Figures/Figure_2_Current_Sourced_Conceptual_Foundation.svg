<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
<title id="title">Figure 2. Current Sourced Conceptual Foundation</title>
<desc id="desc">SOSA/SSN provides the current hierarchy of Asset, System, Platform, and Sensor, Actuator, Sampler. CSAPI adds independent systemType and assetType facets. The motivating hardware sensing case is currently characterized as systemType equals Sensor and assetType equals Equipment.</desc>
<defs>
  <linearGradient id="box" x1="0" x2="1"><stop offset="0%" stop-color="#f7fbff"/><stop offset="100%" stop-color="#e8f2ff"/></linearGradient>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#10213a"/></marker>
  <style>
    .title{font:700 40px Georgia,serif;fill:#10213a}.head{font:700 30px Georgia,serif;fill:#10213a}.subhead{font:700 25px Georgia,serif;fill:#10213a}
    .body{font:24px Georgia,serif;fill:#243447}.small{font:22px Georgia,serif;fill:#243447}.italic{font:italic 21px Georgia,serif;fill:#243447}
    .box{fill:url(#box);stroke:#10213a;stroke-width:2.5}.mini{fill:#ffffff;stroke:#10213a;stroke-width:2}.line{stroke:#10213a;stroke-width:4;fill:none;marker-end:url(#arrow)}
    .dash{stroke:#10213a;stroke-width:3.5;stroke-dasharray:10 8;fill:none;marker-end:url(#arrow)}.panel{fill:#ffffff;stroke:#5f738f;stroke-width:2;stroke-dasharray:6 5}
  </style>
</defs>
<rect width="1400" height="980" fill="#ffffff"/>
<text x="700" y="58" text-anchor="middle" class="title">Figure 2. Current Sourced Conceptual Foundation</text>
<rect x="70" y="100" width="760" height="790" rx="4" class="panel"/>
<text x="450" y="135" text-anchor="middle" class="head">SOSA/SSN conceptual structure</text>
<rect x="315" y="165" width="270" height="78" rx="3" class="box"/><text x="450" y="212" text-anchor="middle" class="head">Asset</text>
<rect x="170" y="320" width="250" height="78" rx="3" class="box"/><text x="295" y="367" text-anchor="middle" class="head">System</text>
<rect x="480" y="320" width="250" height="78" rx="3" class="box"/><text x="605" y="367" text-anchor="middle" class="head">Platform</text>
<path d="M295 320 L295 245" class="line"/><path d="M605 320 L605 245" class="line"/>
<text x="452" y="280" text-anchor="middle" class="italic">specializations / members of Asset</text>
<rect x="95" y="525" width="190" height="78" rx="3" class="box"/><text x="190" y="572" text-anchor="middle" class="subhead">Sensor</text>
<rect x="300" y="525" width="190" height="78" rx="3" class="box"/><text x="395" y="572" text-anchor="middle" class="subhead">Actuator</text>
<rect x="505" y="525" width="190" height="78" rx="3" class="box"/><text x="600" y="572" text-anchor="middle" class="subhead">Sampler</text>
<path d="M190 525 L190 398" class="line"/><path d="M395 525 L395 398" class="line"/><path d="M600 525 L600 398" class="line"/>
<text x="392" y="466" text-anchor="middle" class="italic">specializations of System</text>
<rect x="165" y="680" width="520" height="120" rx="3" class="mini"/>
<text x="425" y="720" text-anchor="middle" class="subhead">Current V2 reading</text>
<text x="425" y="760" text-anchor="middle" class="body">Sensor is a sourced System specialization associated with observing.</text>
<text x="425" y="792" text-anchor="middle" class="body">Platform is separate from Sensor and hosts Assets/Systems.</text>
<rect x="890" y="100" width="440" height="790" rx="4" class="panel"/>
<text x="1110" y="135" text-anchor="middle" class="head">CSAPI classification facets</text>
<rect x="945" y="195" width="330" height="210" rx="3" class="box"/>
<text x="1110" y="235" text-anchor="middle" class="head">systemType</text><text x="1110" y="272" text-anchor="middle" class="body">principal role or activity</text>
<text x="1110" y="315" text-anchor="middle" class="small">Sensor · Actuator · Sampler</text><text x="1110" y="347" text-anchor="middle" class="small">Platform · System</text>
<rect x="945" y="450" width="330" height="250" rx="3" class="box"/>
<text x="1110" y="490" text-anchor="middle" class="head">assetType</text><text x="1110" y="527" text-anchor="middle" class="body">kind of realization</text>
<text x="1110" y="570" text-anchor="middle" class="small">Equipment · Human · LivingThing</text><text x="1110" y="602" text-anchor="middle" class="small">Simulation · Process · Group · Other</text>
<rect x="930" y="748" width="360" height="102" rx="3" class="mini"/>
<text x="1110" y="785" text-anchor="middle" class="subhead">Motivating hardware sensing case</text>
<text x="1110" y="820" text-anchor="middle" class="body">systemType = Sensor</text><text x="1110" y="847" text-anchor="middle" class="body">assetType = Equipment</text>
<path d="M735 565 C820 565, 855 565, 945 565" class="dash"/><text x="842" y="540" text-anchor="middle" class="italic">independent but combinable facets</text>
<text x="700" y="940" text-anchor="middle" class="italic">Current V2 position: use sourced concepts and combinations without coining a new class prematurely.</text>
</svg>