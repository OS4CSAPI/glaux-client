<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc">
<title id="title">Figure 3. Composition and Deployment-Scoped Attachment</title>
<desc id="desc">Two side-by-side views compare an enduring subsystem relationship with a deployment-scoped attachment relationship.</desc>
<defs>
  <linearGradient id="box" x1="0" x2="1"><stop offset="0%" stop-color="#f7fbff"/><stop offset="100%" stop-color="#e8f2ff"/></linearGradient>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#10213a"/></marker>
  <style>
    .title{font:700 40px Georgia,serif;fill:#10213a}.head{font:700 28px Georgia,serif;fill:#10213a}.subhead{font:700 24px Georgia,serif;fill:#10213a}
    .body{font:24px Georgia,serif;fill:#243447}.small{font:21px Georgia,serif;fill:#243447}.italic{font:italic 21px Georgia,serif;fill:#243447}
    .box{fill:url(#box);stroke:#10213a;stroke-width:2.5}.mini{fill:#ffffff;stroke:#10213a;stroke-width:2}.panel{fill:#ffffff;stroke:#5f738f;stroke-width:2;stroke-dasharray:6 5}
    .link{stroke:#10213a;stroke-width:4;fill:none;marker-end:url(#arrow)}.dashed{stroke:#10213a;stroke-width:4;stroke-dasharray:12 8;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1400" height="940" fill="#ffffff"/>
<text x="700" y="55" text-anchor="middle" class="title">Figure 3. Composition and Deployment-Scoped Attachment</text>
<rect x="60" y="100" width="600" height="690" rx="4" class="panel"/>
<text x="360" y="140" text-anchor="middle" class="head">A. Enduring / integral subsystem relationship</text>
<rect x="145" y="220" width="430" height="105" rx="3" class="box"/>
<text x="360" y="260" text-anchor="middle" class="head">Parent Sensor System</text><text x="360" y="295" text-anchor="middle" class="body">complete system being described and managed</text>
<rect x="220" y="455" width="280" height="95" rx="3" class="box"/>
<text x="360" y="493" text-anchor="middle" class="subhead">Integral Subsystem</text><text x="360" y="524" text-anchor="middle" class="small">ordinarily enduring part of the parent</text>
<path d="M360 325 L360 445" class="link"/><text x="385" y="392" class="subhead">composition</text>
<rect x="110" y="610" width="500" height="135" rx="3" class="mini"/>
<text x="360" y="650" text-anchor="middle" class="subhead">Interpretation</text>
<text x="360" y="687" text-anchor="middle" class="body">The subsystem is part of the parent as normally configured.</text>
<text x="360" y="717" text-anchor="middle" class="body">Maintenance removal may be possible, but ordinary identity and</text>
<text x="360" y="746" text-anchor="middle" class="body">description treat it as an enduring component of that parent.</text>

<rect x="740" y="100" width="600" height="690" rx="4" class="panel"/>
<text x="1040" y="140" text-anchor="middle" class="head">B. Deployment-scoped / interchangeable attachment</text>
<rect x="785" y="220" width="255" height="105" rx="3" class="box"/>
<text x="912" y="260" text-anchor="middle" class="head">Sensor Unit</text><text x="912" y="295" text-anchor="middle" class="small">host device / recorder / node</text>
<rect x="1040" y="220" width="255" height="105" rx="3" class="box"/>
<text x="1167" y="260" text-anchor="middle" class="head">Detachable Sensor</text><text x="1167" y="295" text-anchor="middle" class="small">connected for a period of use</text>
<rect x="895" y="445" width="290" height="95" rx="3" class="box"/>
<text x="1040" y="482" text-anchor="middle" class="subhead">Deployment</text><text x="1040" y="514" text-anchor="middle" class="small">time-scoped association context</text>
<path d="M912 325 L980 438" class="dashed"/><path d="M1167 325 L1098 438" class="dashed"/>
<text x="1042" y="382" text-anchor="middle" class="subhead">associated through deployment</text>
<rect x="790" y="610" width="500" height="135" rx="3" class="mini"/>
<text x="1040" y="650" text-anchor="middle" class="subhead">Interpretation</text>
<text x="1040" y="687" text-anchor="middle" class="body">The attached sensor is not permanently bound to one parent.</text>
<text x="1040" y="717" text-anchor="middle" class="body">It may be connected by cable or mount and later associated with</text>
<text x="1040" y="746" text-anchor="middle" class="body">a different parent in another deployment.</text>
<text x="700" y="845" text-anchor="middle" class="italic">Physical attachment alone is not the deciding criterion. The key distinction is enduring identity within the parent versus a time-scoped, re-assignable association.</text>
<text x="700" y="885" text-anchor="middle" class="italic">Use labeled relationships in the DIM unless and until UML aggregation/composition semantics are independently proven.</text>
</svg>